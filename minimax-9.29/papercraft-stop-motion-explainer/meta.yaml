summary-en: Turn a knowledge topic into a papercraft explainer package with paper characters, layered sets, storyboards, and prompts; generate media only with explicit user permission.
summary-cn: 根据知识主题设计纸偶、分层布景、分镜与提示词，输出制作包，仅经用户明确许可生成媒体。
desc-en: For creators explaining science, education, or general knowledge through tactile papercraft visuals. Provide a topic, knowledge points, or source material, with optional audience, duration, aspect ratio, and deliverable requirements. First establish the learning goal and visual metaphor, then propose creative directions, design paper characters and layered sets, and prepare previews, prompts, storyboards, camera movement, transitions, and sound. Deliver a production-ready package or requested individual assets. Every image, video, and audio generation requires explicit user permission for its scope; approving a plan alone does not authorize generation. Quality checks report findings and stop for instructions. Best for cut-paper, pop-up-book, layered diorama, and miniature stop-motion explainers, not standard cartoons, line doodles, or live action.
desc-cn: 面向用手工纸艺讲解科学、教育或泛知识的创作者。提供主题、知识点或材料，可指定受众、时长、画幅和交付类型。先提炼目标与隐喻，再选创意方向，设计纸偶和分层布景，规划预览、提示词、分镜、运镜、转场与声音。交付制作包或指定单项资产。图片、视频、音频生成均须取得用户对具体范围的明确许可，方案确认不等于生成许可；质检仅报告并等待指令。适用于剪纸、立体书、纸雕和微缩定格，不适用于普通卡通、线稿或真人实拍。

summary-en: Turns sitcom premises, scripts, or references into continuity-safe shorts
  with comic beats, shot prompts, production QA, and optional post-final instrumental
  BGM design.
summary-cn: 把情景喜剧素材整理成含喜剧节拍、镜头提示词、连续性检查和成片后纯器乐 BGM 设计的短片制作包。
desc-en: For creators making narrative AI sitcom shorts from a premise, script, storyboard,
  or visual references. The workflow locks production choices, comic structure, and
  visual style; builds character, set, and prop bibles; prepares timed beats, cut
  maps, shot prompts, and review assets; then guides authorized generation, continuity-aware
  editing, and final QA. Optional instrumental BGM follows explicit approval after
  the first final cut. Execution failures, content defects, and mixing errors receive
  different repairs within one shared budget. Tests, variants, model changes, and
  specification upgrades require scoped authorization; remixing reuses existing picture.
  Best for short situation comedies, not standalone images, generic prompts, or long-form
  drama.
desc-cn: 面向制作叙事型情景喜剧短片的创作者，可输入梗概、剧本、分镜或视觉参考。流程锁定规格、喜剧引擎与画风，建立角色、场景和道具锚点，再编写节拍表、剪辑图及逐镜提示词，审核资产后按授权生成、剪辑并验收。成片后可经确认设计纯器乐配乐。执行失败、内容缺陷与混音问题分别处理，共用预算与次数记录；测试、变体、换模型和升规格须明确授权，重新混音复用既有画面。适合短篇情景喜剧，不用于单图、泛化提示词或长篇剧情。

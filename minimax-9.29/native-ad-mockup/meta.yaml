display-name-zh: 原生广告样机
version: 0.3.2
tag-en: "Advertising / Idea & Concept"
tag-cn: "广告营销 / 创意构思"
complete-tags-en:
  - "Commercial Ad / Creative Generation"
complete-tags-cn:
  - "商业广告 / 创作生成"
summary-en: "Create native soft-ad images inside realistic phone mock frames for products and social-commerce formats."
summary-cn: "为产品生成手机原生软广样机。"
desc-en: "Native Ad Mockup creates product soft-ad images that look like real mobile screenshots inside a slim phone frame. It first asks whether product images are ready and which native format to use, then generates prompts and images for iMessage/DM, WeChat-style chat, Xiaohongshu notes, comment Q&A, product cards, checkout pages, alerts, reminders, weather apps, testimonials, and more. It locks inner-screen proportion, system-font feel, top whitespace, and readable text."
desc-cn: "原生广告样机用于把产品做成像真实手机截图一样的软广图。它会先询问是否已有产品图、想做哪类原生软广，再生成提示词和图片。支持 iMessage、微信聊天、小红书种草、评论区问答、商品卡、结账页、低电量弹窗、提醒事项、天气状态、评价卡等，并内置手机外框、内屏比例、系统字体、顶部留白和可读性规则。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将产品素材包装成手机原生信息流中的软广样机，兼顾界面语境、商品露出与可读文案。
    best-for:
      - 原生广告
      - 手机样机
      - 商品展示
    how-to-use: 提供产品图、平台语境和广告文案，先确认页面类型、用户路径与产品露出位置。
    outputs: 原生广告布局、手机界面样机、产品与文案排版及展示图。
  en-US:
    summary: Place product assets into a native mobile-feed ad mockup while balancing interface context, product visibility, and readable copy.
    best-for:
      - Native Ads
      - Mobile Mockups
      - Product Display
    how-to-use: Provide product images, platform context, and ad copy, then confirm page type, user path, and product placement.
    outputs: A native-ad layout, mobile interface mockup, product and copy composition, and display image.

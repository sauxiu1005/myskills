summary-en: "Design 6-funnel detail pages for skill-teaching courses"
summary-cn: "设计 6 层漏斗的技能教学课程详情页"
desc-en: "For designing e-commerce detail pages for skill-teaching online courses — test prep, coding, design, writing, fitness, language and similar. Takes the course name, target-learner pain scenarios, methodology, curriculum outline and instructor credentials. Produces a 6-layer persuasion funnel image set — hook, scene pain, solution, curriculum, instructor proof, service guarantee — with a 5-tier typography hierarchy, unified brand visuals and skill-visualization elements."
desc-cn: "为技能教学类在线课程设计电商详情页（备考、编程、设计、写作、健身、语言等）。输入课程名称、目标学员痛点场景、方法论、课纲和讲师资质，产出 6 层说服漏斗图组（钩子、场景痛点、解决方案、课程大纲、讲师背书、服务保障），包含 5 级排版层级和统一品牌视觉。"

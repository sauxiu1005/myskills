summary-en: "Generate sleep meditation and ASMR audio"
summary-cn: "生成助眠冥想与ASMR音频"
desc-en: "For sleep, meditation and relaxation audio production covering guided meditation, bedtime stories and ASMR content types. Takes a scene, theme or content direction as input. Produces fully mixed audio combining ASMR-specific TTS with whisper characteristics, intelligent pacing with natural breath pauses, curated nature sound assets and AI-generated background music. Optimized for immersive listening experiences."
desc-cn: "适用于助眠、放松、冥想类音频内容的制作,覆盖引导冥想、睡前故事、ASMR(耳语加白噪音)三种内容类型。输入场景或内容主题,输出混音完成的成品音频。制作流程组合 ASMR 专用耳语音色、带自然呼吸间隔的智能停顿节奏、精选自然音效素材与 AI 生成的背景音乐,针对沉浸式聆听体验进行优化。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将主题与聆听偏好编排成沉浸、舒缓的助眠或冥想音频，并平衡人声、环境声与音乐。
    best-for:
      - 助眠冥想
      - 耳语放松
      - 环境声音
    how-to-use: 提供放松主题、语言和声音偏好，先确认内容类型、节奏与沉浸氛围。
    outputs: 引导词或睡前故事、环境音设计、混音成品与试听说明。
  en-US:
    summary: Compose immersive sleep or meditation audio from a theme and listening preferences, balancing voice, ambience, and music.
    best-for:
      - Sleep Meditation
      - ASMR
      - Ambient Sound
    how-to-use: Provide the relaxation theme, language, and sound preferences, then choose the content type, pacing, and atmosphere.
    outputs: Guidance or bedtime-story copy, ambient sound design, a mixed master, and listening notes.

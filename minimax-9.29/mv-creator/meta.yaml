summary-en: "Turn lyrics into MV storyboard and video"
summary-cn: "把歌词转化为MV分镜与成片"
desc-en: "For music-video creation from lyrics or song to finished cut covering the full production pipeline. Takes lyrics or a music track plus desired style direction as input material. Produces an MV storyboard with shot breakdown, AI generation prompts for each scene, an MV timeline with beat synchronization and editing-software workflow guidance. Delivers a complete generated music video ready for review and publishing."
desc-cn: "适用于音乐视频从歌词到成片的全流程创作,覆盖创意构思、分镜设计到成片输出的完整制作管线。输入歌词或音乐文件、期望的视觉风格方向,输出 MV 分镜故事板(含逐镜头拆解)、各场景 AI 视频生成提示词、与节拍同步的 MV 时间线规划、剪辑软件工作流指引,最终交付可供审阅和发布的 MV 成片。"
cover: "https://cdn.hailuoai.com/hailuo-video-web/public_assets/deb44193-a6e6-46c7-8d19-f602ad240201.mp4"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将歌词、音乐和视觉方向编排为可执行的MV分镜与镜头提示，并在需要时继续完成成片。
    best-for:
      - MV分镜
      - 歌词视觉
      - 音乐叙事
    how-to-use: 提供歌曲、歌词和参考素材，先确认音乐段落、视觉主题与需要交付分镜或成片。
    outputs: 音乐结构、MV概念、分镜表、镜头提示词与可选MV成片。
  en-US:
    summary: Turn lyrics, music, and visual direction into an executable music-video storyboard and shot prompts, with an optional finished video.
    best-for:
      - MV Storyboards
      - Lyric Visuals
      - Music Narratives
    how-to-use: Provide the song, lyrics, and references, then confirm music sections, visual theme, and whether to deliver planning or a finished video.
    outputs: Music structure, MV concept, storyboard, shot prompts, and an optional finished MV.

summary-en: Turns real photos, videos, or text scenes into sketch-motion clips where
  a marker reveals a moving subject as hand-drawn art.
summary-cn: 让真实照片先自然动起来，再由笔尖把运动主体显影成手绘短片。
desc-en: Turn a real photo, reference video, or described scene into a sketch-motion
  short. Confirm the preview, space, and occlusion, then generate a living subject
  with marker-synchronized reveal. Best for pets, people, products, shops, and lifestyle
  scenes, not static stickers or long narratives.
desc-cn: 将实景照片、参考视频或文字场景制作成短视频手绘显影效果。先确认预览、空间和遮挡关系，再规划提示词并生成主体持续运动、笔尖同步显影的成片。适合宠物、人像、产品、小店和生活方式场景，不用于静态贴纸或长篇叙事。
author-en: MiniMax Design
author-cn: MiniMax Design

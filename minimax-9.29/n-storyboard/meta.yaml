summary-en: "Multi-panel storyboard from a story"
summary-cn: "由故事生成多宫格分镜整图"
desc-en: "For producing a single composite N-panel storyboard image from a story in one unified visual output. Takes a story text plus grid setting such as 2x2, 3x3 or 4x4 layout, per-cell aspect ratio and an optional reference image as input. Produces one stitched multi-panel storyboard image rather than separate individual shots, ideal for quick visual storytelling previews and pitch presentations."
desc-cn: "适用于将故事直接生成一张 N 宫格分镜整图的场景,以单张统一视觉输出呈现完整故事。输入故事文本、宫格设置(2x2、3x3 或 4x4 布局)、单格画面比例与可选参考图,输出一张拼合好的多宫格分镜整图(非分散的独立单镜)。特别适合快速视觉叙事预览、项目提案展示和创意沟通场景。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将故事或剧本拆解为镜头顺序与画面任务，并生成便于审阅的多宫格分镜整图。
    best-for:
      - 多宫格分镜
      - 镜头拆解
      - 故事预演
    how-to-use: 提供故事、剧本或梗概，先确认镜头密度、参考素材与画幅方向。
    outputs: 镜头表、分镜提示词、多宫格故事板整图与镜头说明。
  en-US:
    summary: Break a story or screenplay into ordered shot jobs and generate a reviewable multi-grid storyboard image.
    best-for:
      - Grid Storyboards
      - Shot Breakdown
      - Previsualization
    how-to-use: Provide the story, screenplay, or synopsis, then confirm shot density, references, and framing.
    outputs: A shot list, storyboard prompts, a multi-grid board, and shot notes.

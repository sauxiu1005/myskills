summary-en: "Craft AI video and image prompts"
summary-cn: "撰写或优化AI视频图像提示词"
desc-en: "For writing or optimizing prompts targeted at specific AI video and image models with model-specific tuning. Takes a creative intent or an existing prompt to optimize, plus the target model such as Kling, Veo3, Wan, Gemini, Midjourney or Seedance as input. Produces a model-tuned high-quality prompt incorporating model-specific best practices, formatting rules, parameter recommendations and prompt engineering techniques."
desc-cn: "适用于针对特定 AI 视频或图片模型撰写或优化提示词的场景,提供模型级别的精细调优。输入创意意图或待优化的旧 prompt、目标模型(Kling、Veo3、Wan、Gemini、Midjourney、Seedance 等),输出针对该模型调优的高质量提示词。内置各模型的最佳实践、格式要求、参数建议与提示词工程技巧。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将创意意图、参考图或旧提示词改写为符合目标模型能力和表达习惯的清晰视频或图像提示词。
    best-for:
      - 视频提示词
      - 图像提示词
      - 模型适配
    how-to-use: 提供创意、参考素材或旧提示词并说明目标模型，先确认交付类型和关键创作限制。
    outputs: 创作简报、模型适配提示词、负面约束、参考素材映射与生成前检查。
  en-US:
    summary: Rewrite creative intent, references, or an old prompt into a clear video or image prompt adapted to the chosen model’s visible capabilities.
    best-for:
      - Video Prompts
      - Image Prompts
      - Model Adaptation
    how-to-use: Provide the idea, references, or old prompt and name the target model, then confirm deliverable type and creative constraints.
    outputs: A creative brief, adapted prompt, negative constraints, reference mapping, and pre-generation checks.

summary-en: Turns transcript-led narration into reviewable B-roll plans and approval-gated
  video shots for knowledge and talking-head edits.
summary-cn: 把口播逐字稿转成可审片的 B-roll 方案，并在确认后生成镜头。
desc-en: Turn a transcript, voiceover, data narration, or talking-head script into
  a semantic B-roll plan. Route each section to A-roll, reused evidence, text packaging,
  or visual B-roll, flag missing assets, and generate only approved shots. Best for
  knowledge and transcript-led edits.
desc-cn: 把逐字稿、配音稿、数据讲稿或口播脚本按语义拆成可审片的 B-roll 方案。流程判断保留 A-roll、复用素材、文字包装或纯视觉副镜头，标出缺失素材，确认后只生成批准镜头。适合知识视频和逐字稿剪辑，不用于纯字幕导出或简单剪切。

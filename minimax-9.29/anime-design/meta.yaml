summary-en: "14-substyle anime expert with character lock"
summary-cn: "14种二次元画风且锁定角色一致"
desc-en: "For anime-style image generation across 14 substyles including modern moe, Showa cel shading, Ghibli watercolor, Shinkai lighting, Donghua wuxia, Manhwa webtoon, US cartoon, chibi and cyberpunk anime aesthetics. Takes character description, style preference and optional reference image as input. Produces anime images with character lock for identity consistency, facial proportion rules and style coherence across multiple generations."
desc-cn: "适用于二次元及动漫风格的图片生成,覆盖 14 种子风格:日漫现代萌系、昭和赛璐璐、吉卜力水彩、新海诚光影、国漫仙侠水墨、韩漫 webtoon、美漫卡通、Q 版、二次元赛博朋克等。输入角色描述、画风偏好与可选参考图,输出锁定画风、保持角色身份一致的二次元图像,遵循面部比例规则,确保多次生成间的风格连贯性。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将角色设定与目标画风转成角色身份稳定、笔触统一的二次元图像，支持多种视觉方向。
    best-for:
      - 动漫插画
      - 角色设定
      - 画风统一
    how-to-use: 提供角色描述、画风偏好和可选参考图，先确认画风类别与角色锚点。
    outputs: 角色设定图、风格化插画与可复用的画风提示方案。
  en-US:
    summary: Turn character direction and a target art language into consistent anime images with stable identity across multiple visual styles.
    best-for:
      - Anime Illustration
      - Character Design
      - Style Consistency
    how-to-use: Provide the character description, preferred style, and optional references, then lock the style family and identity anchors.
    outputs: Character sheets, stylized illustrations, and reusable style-prompt guidance.

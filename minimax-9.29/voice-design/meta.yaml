display-name-zh: 声音设计
version: 2.0.9
tag-en: "Audio Content / Audio Generation"
tag-cn: "音频内容 / 音频生成"
complete-tags-en:
  - "Sound & Music / Creative Generation"
complete-tags-cn:
  - "音频音乐 / 创作生成"
summary-en: "Design and preview custom voices from text"
summary-cn: "用文字描述设计并试听自定义音色"
desc-en: "For designing custom AI voices when no suitable voice exists in the standard library and a unique voice identity is required. Takes a natural-language description of the desired voice characteristics plus a preview text as input. Produces a sample audio for previewing and a reusable voice_id for TTS integration. This is an experimental feature and quality may be lower than the built-in voice library."
desc-cn: "适用于官方音色库找不到合适声音、需要自定义设计独特音色身份时使用。输入对声音特征的自然语言描述(如年龄、性别、情感色彩、语速等)与试听文本,输出试听样本音频与可复用的 voice_id 供 TTS 集成使用。此功能为实验性质,品质通常低于内置音色库,建议优先使用 get_voice_id 检索现有音色。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 用自然语言描述设计并试听自定义音色，收敛年龄、质感、语速和情绪等声音特征。
    best-for:
      - 自定义音色
      - 声音试听
      - 语音设计
    how-to-use: 提供声音特征描述与试听文本，先确认语种、发音目标和需要比较的声音方向。
    outputs: 声音描述优化、语种确认、试听样本、音色选择建议与复用标识。
  en-US:
    summary: Design and preview a custom voice from natural-language traits, refining age, texture, pace, and emotional character.
    best-for:
      - Custom Voices
      - Voice Previews
      - Voice Design
    how-to-use: Provide voice traits and preview text, then confirm language, pronunciation goals, and directions to compare.
    outputs: A refined voice brief, language confirmation, preview samples, selection guidance, and a reusable voice identifier.

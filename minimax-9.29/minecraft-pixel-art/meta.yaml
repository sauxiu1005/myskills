summary-en: "Convert images to Minecraft pixel art"
summary-cn: "把图片转换为Minecraft像素方块画"
desc-en: "For converting any image into Minecraft-style pixel art with authentic block aesthetics and voxel representation. Takes a source image as input material. Produces a 16x16 voxel and block-style stylized version aligned with Minecraft visual language. Suitable for game-related content creation, social media posts, avatar generation and creative pixel art projects requiring the distinctive Minecraft blocky aesthetic."
desc-cn: "适用于把任意图片转换为 Minecraft 风格像素方块画的场景,忠实还原方块美学与体素表现。输入一张原始图片,输出 16x16 体素方块风格的像素方块画,贴合 Minecraft 美术语言。适用于游戏相关内容创作、社交媒体配图、头像生成以及需要 Minecraft 标志性方块美学的创意像素艺术项目。"

structured-info:
  zh-CN:
    summary: 将照片或插画拆解为可读的Minecraft像素方块画，在有限色彩和网格中保留主体特征。
    best-for:
      - 像素方块
      - 方块像素
      - 图像转换
    how-to-use: 提供源图和希望保留的主体特征，先确认方块密度、色彩取舍与构图范围。
    outputs: 主体分析、方块翻译方案、色彩表、像素方块图与难点说明。
  en-US:
    summary: Translate a photo or illustration into readable Minecraft block art while preserving its subject within a limited grid and palette.
    best-for:
      - Block Pixel Art
      - Minecraft
      - Image Translation
    how-to-use: Provide the source image and features to preserve, then confirm block density, palette trade-offs, and composition.
    outputs: Subject analysis, block-translation plan, palette guide, pixel-block artwork, and trade-off notes.

structured-info:
  zh-CN:
    summary: 将角色、舞剑动作与山水场景设计成统一的国风武侠分镜，并生成具有节奏感的舞剑短片。
    best-for:
      - 武侠舞剑
      - 国风动作
      - 动作分镜
    how-to-use: 提供角色参考、舞剑意图和场景偏好，先确认角色身份、动作难度与镜头节奏。
    outputs: 角色图、舞剑动作图、环境建立镜头、分镜提示词与武侠短片。
  en-US:
    summary: Turn a character, sword-dance action, and landscape setting into a unified Chinese wuxia storyboard and rhythmic dance short.
    best-for:
      - Wuxia Sword Dance
      - Chinese Action
      - Action Storyboards
    how-to-use: Provide the character reference, sword-dance intent, and setting preference, then confirm identity, action difficulty, and camera rhythm.
    outputs: Character art, sword-action images, establishing shots, storyboard prompts, and the wuxia short.

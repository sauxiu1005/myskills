summary-cn: "生成国风武侠舞剑短片"
desc-en: "For Chinese-style wuxia sword-dance MV shorts featuring traditional martial arts aesthetics. Takes a creative concept or character setup as input. Produces a stylistically consistent set of Midjourney V7 wuxia character images and a final composite storyboard video via Seedance 2.0 multi-image reference compositing. Maintains visual coherence across all generated assets for a unified cinematic wuxia atmosphere."
desc-cn: "适用于国风武侠舞剑类 MV 动画短片的制作,融合传统武术美学与现代视觉特效。输入创意概念或角色设定,输出风格统一的 Midjourney V7 武侠角色图集,经 Seedance 2.0 多图参考合成技术将角色融入场景,最终输出完整分镜成片。全流程保持视觉一致性,营造统一的电影级武侠氛围。"

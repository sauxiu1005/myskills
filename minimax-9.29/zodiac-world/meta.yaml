desc-en: 'For producing preschool English-learning IP episodes set in a 12-zodiac forest village. Takes a chapter topic, focus animal character and a target English expression like "May I come in?". Produces a two-layer deliverable per chapter: a 1000-1200-word story script with locked per-character voice styles, plus a 30-60-second video plan with beat-by-beat scene blocks, dialogue lines and a custom closing song lyric.'
desc-cn: '用于制作以“12 生肖森林村庄”为世界观的儿童英语启蒙 IP 剧集。输入：每章主题、当集焦点动物角色、以及一句核心英语表达。输出：每章双层交付物：一份 1000–1200 字、锁定每个角色英语口吻的小说剧本，外加一份 30–60秒的视频方案。'

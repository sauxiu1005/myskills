summary-en: Turns stories or scripts into narrated live-action episodes with continuity
  assets, time-coded multi-shot clips, one default three-panel storyboard per video
  clip, dialogue, narration, and optional subtitles.
summary-cn: 将故事或剧本制作成旁白推进的真人短剧，区分片段内切镜，并默认每个视频输出三格时间分镜。
desc-en: For creators producing narrated live-action short dramas. Provide a story
  or script with optional character, scene, and audio references; the workflow locks
  continuity, plans timed three-panel boards, generates video, and aligns narration
  to the edit. MiniMax-H3 is the default.
desc-cn: 面向制作半解说真人短剧的创作者。用户提供故事或剧本及可选角色、场景、音频参考；流程锁定视觉方向，建立连续性资产，规划时间码和三格分镜，生成视频并按真实时间轴对齐旁白。默认使用
  MiniMax-H3，交付短剧、旁白和可选字幕，不用于动画或普通剪辑。
author-en: MiniMax Design
author-cn: MiniMax Design
source: official-featured

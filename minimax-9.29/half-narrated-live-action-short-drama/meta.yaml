structured-info:
  zh-CN:
    summary: 将短剧故事制作成旁白推进、角色对白补充且人物场景连续的真人短剧单集。
    best-for:
    - 真人短剧
    - 旁白叙事
    - 连续镜头
    how-to-use: 提供剧本或故事、角色设定和视觉参考，先确认单集规格、旁白比例与分辨率。
    outputs: 真人角色与场景设定、双通道脚本、镜头表、视频片段与短剧成片。
  en-US:
    summary: Turn a short-drama story into a continuous live-action episode driven
      by narration and supported by character dialogue.
    best-for:
    - Live-action Drama
    - Narrated Storytelling
    - Continuous Shots
    how-to-use: Provide the script or story, character direction, and visual references,
      then confirm episode specs, narration balance, and resolution.
    outputs: Live-action character and scene direction, a two-channel script, shot
      list, video segments, and finished episode.

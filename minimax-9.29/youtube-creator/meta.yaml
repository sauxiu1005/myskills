summary-en: "Generate YouTube script and thumbnail"
summary-cn: "生成YouTube脚本与封面"
desc-en: "For YouTube content planning from ideation through to thumbnail design covering the pre-production phase. Takes a topic or channel direction as input. Produces topic plans with audience analysis, retention-optimized scripts with hook and payoff structure, and high-CTR thumbnail designs. Focuses on the planning and scripting stage and does not generate concept images, voiceover, video clips or final assembly."
desc-cn: "适用于 YouTube 视频从选题策划到封面设计的前期制作阶段,覆盖内容创作的核心规划环节。输入选题方向或频道定位,输出包含受众分析的选题规划、以 hook-payoff 结构优化留存率的脚本、高点击率封面图设计。聚焦策划与脚本阶段,不负责概念图生成、配音录制、视频片段制作与最终合成。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将YouTube选题发展为兼顾受众、留存和点击的脚本与高点击率封面规划，聚焦前期创作。
    best-for:
      - YouTube选题
      - 留存脚本
      - 视频封面
    how-to-use: 提供频道定位或选题方向，先确认受众、视频目标和内容形式，再进入脚本与封面规划。
    outputs: 选题分析、Hook与Payoff脚本、章节结构、封面概念与封面图。
  en-US:
    summary: Develop a YouTube topic into an audience-aware, retention-focused script and high-click thumbnail plan for pre-production.
    best-for:
      - YouTube Topics
      - Retention Scripts
      - Video Thumbnails
    how-to-use: Provide the channel positioning or topic direction, then confirm audience, video goal, and format before planning script and thumbnail.
    outputs: Topic analysis, hook-and-payoff script, chapter structure, thumbnail concept, and thumbnail image.

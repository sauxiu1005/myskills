structured-info:
  zh-CN:
    summary: 将短剧创意发展为可持续推进的剧集世界、人物弧线与分集剧本，保持长期叙事连贯。
    best-for:
      - 剧集开发
      - 人物弧线
      - 分集剧本
    how-to-use: 提供题材、受众和核心人物，先确认剧集规模、主线冲突与单集节奏。
    outputs: 剧集定位、世界观与人物弧线、分集大纲、场次脚本与连续性记录。
  en-US:
    summary: Develop a short-drama concept into a sustainable series world, character arcs, and episode scripts with long-form continuity.
    best-for:
      - Series Development
      - Character Arcs
      - Episode Scripts
    how-to-use: Provide the genre, audience, and core characters, then confirm series scale, central conflict, and episode rhythm.
    outputs: Series positioning, world and character arcs, episode outlines, scene scripts, and continuity records.

display-name-zh: 微短剧剧集编剧
version: 0.1.6
tag-en: "Short Drama / Intent Brainstorming"
tag-cn: "短剧漫剧 / 意图脑爆"
summary-en: "Create full short-drama scripts from concept to episode export."
summary-cn: "一键短剧全流程剧本"
desc-en: "Full-process short-drama scriptwriting. Covers topic selection, target audience, character relations, pacing hooks, paywall beats, episode outlines, single-episode drafts, and complete export, generating a 50 to 100 episode short-drama package. Supports vertical-screen domestic dramas and overseas ReelShort or DramaBox, spanning god-of-war, baby-genius, comeback, sweet-love, and revenge genres. Produces text scripts only, does not generate video."
desc-cn: "微短剧全流程剧本创作。从选题、目标受众、人物关系、爽点节奏、付费卡点、分集大纲到单集剧本与完整导出，系统生成 50-100 集短剧方案与剧本；支持竖屏与出海 ReelShort/DramaBox，涵盖战神/萌宝/逆袭/甜宠/复仇等类型。产出为纯文字剧本，不生成视频。"
complete-tags-en:
  - "Short Drama / Intent Brainstorming"
complete-tags-cn:

display-name-zh: 二次元风格锻造
version: 0.2.12
tag-en: "Visual Production / Image Generation"
tag-cn: "视觉创作 / 图像生成"
complete-tags-en:
  - "Animation / Creative Generation"
complete-tags-cn:
  - "动画 / 创作生成"
summary-en: "Forge anime characters in target styles"
summary-cn: "把角色锻造为目标二次元画风"
desc-en: "For anime style transfer and character stylization across Japanese, Donghua, Manhwa and Western anime systems. Takes a reference image and target style direction as input. Produces stylistically reforged images via 10-dimension style decomposition covering line weight, color palette, shading method and more, collapsed into 3-axis Form, Aesthetic and Mood positioning, with matched generation tooling per style genome."
desc-cn: "适用于二次元及动漫角色的风格化生成与画风转换,覆盖日系、国漫、韩系、欧美等画风体系。输入参考图与目标风格方向,输出复刻该风格的新图。通过 10 维拆解(线条粗细、色彩方案、着色方式等)→ Form、Aesthetic、Mood 三轴坍缩定位画风基因,自动匹配最优生成工具与 prompt 写法,确保风格转换的精准度。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 从参考图提炼画风基因并迁移到角色或场景，生成保留主体含义且风格明确的二次元新图。
    best-for:
      - 画风迁移
      - 角色重绘
      - 视觉风格
    how-to-use: 提供主体参考图和目标画风，先拆解线条、色彩、质感与情绪特征。
    outputs: 画风拆解报告、风格化提示词与目标画风图像。
  en-US:
    summary: Extract style DNA from references and transfer it to a character or scene while preserving meaning and establishing a clear anime language.
    best-for:
      - Style Transfer
      - Character Redraw
      - Visual Language
    how-to-use: Provide a subject reference and target style, then analyze linework, color, texture, and mood before transforming it.
    outputs: Style analysis, transfer prompts, and images in the target art language.

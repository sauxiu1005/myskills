display-name-zh: 国风短剧成片生成器
version: 1.2.6
tag-en: "Short Drama / Creative Generation"
tag-cn: "短剧漫剧 / 创作生成"
summary-en: "Create full Chinese-style short drama videos from ideas or scripts."
summary-cn: "国风短剧全流程成片"
desc-en: "Full workflow for Chinese-style short-drama production. Step by step confirms script status, aspect ratio, character references, and visual direction; drives from script to storyboard brief, multi-angle character sheets, scene reference sheets, 2x4 monochrome panels, panel-level video prompts, video generation, and final assembly. Includes built-in Chinese-style and xianxia short-drama aesthetics plus full AI expression and natural-blink performance logic."
desc-cn: "全流程国风短剧制作工作流。分步确认脚本状态、画面比例、角色参考、画风方向；脚本→故事板概要→角色多角度设定图→场景设定图→2x4 黑白分镜→Panel 级视频提示词→视频→合成成片；内置国风/仙侠短剧画风与完整 AI 表情、自然眨眼表演逻辑。"
complete-tags-en:
  - "Short Drama / Creative Generation"
complete-tags-cn:
  - "短剧漫剧 / 创作生成"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
cover: "https://cdn.hailuoai.com/hailuo-video-web/public_assets/d43b013f-5a76-45f4-8f8b-c43b2d8097c0.mp4"
structured-info:
  zh-CN:
    summary: 将国风短剧剧本转化为角色、场景、分镜和连续镜头，并合成为可观看的完整短剧。
    best-for:
      - 国风短剧
      - 仙侠叙事
      - 连续成片
    how-to-use: 提供剧本或故事设定、角色参考和画风方向，先确认脚本状态、画幅与视觉路线。
    outputs: 故事板概要、角色与场景设定、分镜提示词、视频片段及短剧成片。
  en-US:
    summary: Turn a Chinese-style short-drama script into characters, scenes, storyboards, continuous shots, and a watchable finished episode.
    best-for:
      - Chinese Short Drama
      - Wuxia Fantasy
      - End-to-end Episodes
    how-to-use: Provide a script or premise, character references, and visual direction, then confirm script status, framing, and style route.
    outputs: A story outline, character and scene designs, storyboard prompts, video clips, and the finished episode.

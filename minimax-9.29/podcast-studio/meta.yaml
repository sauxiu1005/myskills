display-name-zh: 播客工作室
version: 0.3.2
tag-en: "Audio Content / Post-Production"
tag-cn: "音频内容 / 后期制作"
complete-tags-en:
  - "Sound & Music / Post-production"
complete-tags-cn:
  - "音频音乐 / 后期处理"
summary-en: "Turn written content into a podcast script with narration timing, music cues, and sound effect direction."
summary-cn: "把书面内容改写成播客脚本，附带朗读时长、音乐 cue 和音效指令。"
desc-en: "Podcast Studio transforms any long-form written piece into a producer-ready podcast script. It segments the text into cold open, intro, chapters, and outro, attaches audio direction (music beds, transitions, SFX), and estimates spoken duration for each section. Music cue guidance assumes a browser-based delivery stack using Tone.js for synthesized beds and Howler.js for discrete sound effects. Ideal for turning articles, essays, or briefings into podcasts, drafting show notes with audio cues, and specifying sound design for spoken content."
desc-cn: "Podcast Studio 把任意长文转成可直接进棚的播客脚本。按 cold open、片头、章节、结尾拆分文本，为每段附上音频指令（音乐 bed、转场、SFX），并给出朗读时长估算。音乐 cue 假设浏览器端交付栈：Tone.js 做音乐 bed，Howler.js 触发离散音效。适合把文章、专栏、简报改成播客节目，起草带音频 cue 的 shownote，或给口播内容规划声音设计。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将文章、简报或长文改写为可制作的播客脚本，明确朗读时长、音乐进入点和音效提示。
    best-for:
      - 播客脚本
      - 音频编排
      - 音效Cue
    how-to-use: 提供原始文章或长文，先确认节目形式、听众、语气和目标时长。
    outputs: 分段播客脚本、朗读时长、音乐Cue、音效指令与制作备注。
  en-US:
    summary: Rewrite an article, briefing, or long-form text into a producible podcast script with timing, music cues, and sound effects.
    best-for:
      - Podcast Scripts
      - Audio Blocking
      - Sound Cues
    how-to-use: Provide the source article or long text, then confirm show format, audience, tone, and target duration.
    outputs: A segmented podcast script, reading timings, music cues, sound-effect instructions, and production notes.

display-name-zh: 剪映导出
version: 3.0.14
tag-en: "Visual Production / Post-Production"
tag-cn: "视觉创作 / 后期制作"
complete-tags-en:
  - "Platform Tooling"
complete-tags-cn:
  - "平台工具"
summary-en: "Push videos to JianYing or CapCut drafts"
summary-cn: "把视频推送到剪映或CapCut草稿"
desc-en: "For pushing AI-assembled video projects into JianYing or CapCut as editable drafts for manual post-production. Takes a video project including clips, timeline and assets as input. Produces a draft directly in the local JianYing or CapCut draft directory ready to open and edit in the desktop application. Built on the pyJianYingDraft library for reliable draft format compatibility and seamless workflow integration."
desc-cn: "适用于把已组装好的视频工程推送到剪映或 CapCut 进行人工后期精修的场景。输入视频工程(包含片段、时间轴与素材资源),输出直接生成在本机剪映或 CapCut 草稿目录的工程文件,打开桌面应用即可编辑。基于 pyJianYingDraft 库封装,确保草稿格式兼容性与工作流的无缝衔接。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将已组装的视频工程整理为剪映或CapCut可继续编辑的本机草稿，衔接生成与人工后期。
    best-for:
      - 剪映草稿
      - 工程导出
      - 人工后期
    how-to-use: 提供已完成的片段、素材和时间轴，先确认目标剪辑应用与导出模式。
    outputs: 可编辑草稿工程、素材关联、时间轴结构与导出检查结果。
  en-US:
    summary: Package an assembled video project as an editable local Jianying or CapCut draft for human post-production.
    best-for:
      - Editing Drafts
      - Project Export
      - Human Finishing
    how-to-use: Provide the finished clips, source assets, and timeline, then confirm the target editor and export mode.
    outputs: An editable draft project, linked assets, timeline structure, and export checks.

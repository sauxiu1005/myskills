summary-en: "Turn short audio and visual references into rhythm-synced anime PV concepts and finished clips."
summary-cn: "将短音频与视觉参考转化为节奏同步的二次元PV创作方案并输出完整成片"
desc-en: "Turns audio, reference videos, character art, stills, or storyboards under 15 seconds into anime PV, MV, text-animation PV, and motion-design MG workflows. It confirms format and available materials, analyzes lyrics, beats, strings, emotion, and reference style, proposes 9/16-panel storyboards, writes high-density H3 prompts, generates high-quality clips, and assembles a beat-synced final video while preserving confirmed character, layout, lyric, and style decisions."
desc-cn: "将15秒以内的音频、参考视频、二次元立绘、静帧或分镜转化为二次元PV、MV、文字动画PV和动态设计MG工作流及完整成片。先通过卡片确认制作类型与可用素材，再分析歌词、鼓点、弦乐、情绪段落和参考风格，规划9/16宫格分镜，生成高密度H3长提示词与高精度片段，并按节拍完成镜头、文字、转场和音频合成。流程会保留用户确认的角色、构图、歌词、画风和分镜结构，并在生成前提供必要的方向确认。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将短音频、歌词与视觉参考编排成节拍同步的二次元PV，并完成文字、画面和声音的统一表达。
    best-for:
      - 动画PV
      - 节拍剪辑
      - 歌词视觉
    how-to-use: 提供短音频、歌词和视觉素材，先选择制作类型并确认音乐段落与画幅。
    outputs: 音乐分析、九宫格分镜、动态提示方案与合成PV成片。
  en-US:
    summary: Arrange short audio, lyrics, and visual references into a beat-synced anime PV with unified text, imagery, and sound.
    best-for:
      - Anime PVs
      - Beat Editing
      - Lyric Visuals
    how-to-use: Provide short audio, lyrics, and visual assets, then select the production type and confirm the music window and framing.
    outputs: Music analysis, grid storyboards, motion prompts, and a finished composite PV.
desc-en: "Turn a theme or keyword into a short rap hook, ask the user to choose a male or female voice, generate an eight-second vocal rap clip, then show a photo-upload reminder card. The user uploads a photo through chat attachments, and the workflow uses MiniMax-H3 to create two eight-second 2K rap MV videos with two truly random visual styles, then muxes the original rap clip as the final soundtrack."
desc-cn: "根据用户输入的一句话或关键词生成短 rap 钩子，先让用户选择男声或女声，再生成 8 秒说唱音频。音频完成后提示上传人物照片，使用 MiniMax-H3 生成两个 8 秒 2K 说唱 MV 视频，随机抽取两套不同风格，并将原始说唱音频混流为最终音轨。"

display-name-zh: 多角度
version: 1.0.11
tag-en: "Visual Production / Image Generation"
tag-cn: "视觉创作 / 图像生成"
complete-tags-en:
  - "Animation / Creative Generation"
complete-tags-cn:
  - "动画 / 创作生成"
summary-en: "Re-render image from a new camera angle"
summary-cn: "用新相机视角重新渲染图片"
desc-en: "For creators who need an alternate camera view of an existing image without redesigning its subject or event. Provide one source image, choose a new horizontal angle, vertical angle, and framing distance, then identify the face, product shape, room layout, text, or other details that must remain stable. The workflow analyzes visible geometry, explains which hidden surfaces require inference, confirms risky viewpoint changes, produces the alternate view, and checks identity, proportions, lighting, scene layout, and typography. It delivers one re-rendered image plus a concise camera-view note. It is best for plausible viewpoint changes, not inventing unseen product details or changing the depicted action."
desc-cn: "面向需要为已有图片补充新机位、但不希望重做主体或事件的创作者。用户提供一张原图，选择水平角度、俯仰方向和景别距离，并说明人脸、产品外形、房间布局、文字或其他必须保留的细节。流程先分析原图可见结构，指出新视角中需要推测的遮挡面，再确认风险较高的机位变化，生成新视角并检查身份、比例、光线、场景关系与文字一致性。最终交付一张重渲染图片和简短机位说明，适合合理换视角，不用于凭空补全精密产品结构或改变原有动作。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 从单张源图推断新的相机位置与视角，尽量保持主体身份、空间关系和关键细节一致。
    best-for:
      - 多视角重渲染
      - 相机视角
      - 主体一致
    how-to-use: 提供源图和目标视角或镜头意图，先确认需要固定的主体细节与允许推断的空间范围。
    outputs: 源视角分析、目标镜头方案、多角度提示词与重新渲染图像。
  en-US:
    summary: Infer a new camera position from one source image while preserving subject identity, spatial relationships, and critical details.
    best-for:
      - Multi-view Rendering
      - Camera Angles
      - Subject Consistency
    how-to-use: Provide the source image and target angle or camera intent, then confirm protected details and the amount of spatial inference.
    outputs: Source-view analysis, target-camera direction, multi-view prompts, and the re-rendered image.

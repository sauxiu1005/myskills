structured-info:
  zh-CN:
    summary: 根据角色形象和界面截图，制作角色穿梭界面、按压拖拽控件并触发反馈的三维互动动画，交付成片与可编辑工程。
    best-for:
      - 界面角色互动
      - 产品创意宣传
      - 趣味短片
    how-to-use: 上传角色形象和界面截图，说明希望角色完成的操作、时长与画幅；也可指定通用软件工作区。
    outputs: 带声 MP4、可修改建模的 Blender 工程、含完整依赖的工程包、界面源码、动作时间线、声音分轨与验收记录。
  en-US:
    summary: Turn a character image and interface screenshot into a 3D interaction short where the character crosses panels and presses or drags controls with feedback, delivered with an editable project.
    best-for:
      - Software UI Character Interaction
      - Product and App Promos
      - Personal Page Fun Shorts
    how-to-use: Upload the character image and interface screenshots, describe the operations the character should perform, plus duration and aspect ratio; a generic software workspace can also be requested.
    outputs: MP4 with sound, an editable Blender project, a complete project package with dependencies, UI source, action timeline, sound stems and QA records.

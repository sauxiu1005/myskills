structured-info:
  zh-CN:
    summary: "把你的故事交给一位导演来拍，运镜、剪辑、声音都按其风格设计，专属色卡锁定影调。"
    best-for: [导演风格片, 色卡生成, 镜头提示词]
    how-to-use: "提供剧本或一句故事，选择导演、画幅、时长与分辨率，先审核方案再生成。"
    outputs: "所选配色方案与色卡、含运镜、切点与声音的镜头表和提示词，以及按需生成的成片。"
  en-US:
    summary: "Have your story shot by one director's style, with camera, editing and sound designed to match and dedicated color cards locking the look."
    best-for: [Director-style shorts, Color-card-referenced generation, Shot lists with prompts]
    how-to-use: "Send a script or one-line story, pick a director (or name another), then set aspect ratio, duration and resolution; review the plan before generating the film."
    outputs: "The chosen color scheme and card, a shot list with camera, cuts, sound and prompts, plus a generated film on request."

summary-en: Transforms stories and references into original stills, visual series, and short films using Iwai-inspired emotional observation, natural light, and meaningful negative space.
summary-cn: 把故事与参考素材转化为带有自然光、情绪观察和留白的原创电影画面与短片。
desc-en: For filmmakers and visual creators seeking original Iwai Shunji-inspired imagery. Supply a theme, script, assets, references, framing and a still or video goal. The workflow identifies a visible emotional change, establishes a consistent visual bible and selects a seasonal or urban direction. It prepares a reviewable storyboard, divides longer stories into segments supported by the chosen capability, and creates reference images for approval before generating and assembling the film. Deliverables include images, short films, prompts, plans and verification notes as requested. It does not copy film frames, claim a fixed director formula, or substitute an unlabelled slideshow for missing video generation.
desc-cn: 面向希望创作岩井俊二式情绪影像的影视与视觉创作者。提供主题、剧本、素材、画幅及图片或视频目标，先提取可见的情绪变化，统一人物、环境与光色，选择季节或都市视觉方向，再编写可审阅分镜。长故事按实际能力分段，并生成参考图供确认后制作与合成。按需求交付图片、短片、提示词、方案与验证说明，不复制电影原帧，不宣称固定导演公式，不把静帧相册冒充视频。

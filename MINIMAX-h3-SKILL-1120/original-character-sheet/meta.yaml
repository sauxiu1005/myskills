    how-to-use: 提供角色创意或风格参考，确认风格、版式和画幅；三视图先确认单人母版。
    outputs: 角色设定文档、可直接提交的提示词、角色设定图与母版派生三视图。
  en-US:
    summary: Expand a one-line idea into an original character sheet and derive turnarounds that keep the solo master's face and materials.
    best-for:
    - Original Character Design
    - Character Turnarounds
    - Collectible Look
    how-to-use: Provide a one-line character idea or style reference, confirm the style direction, layout and aspect ratio, and confirm a solo master before turnarounds.
    outputs: Character setting documents, submit-ready prompts, character sheets and master-derived turnarounds.

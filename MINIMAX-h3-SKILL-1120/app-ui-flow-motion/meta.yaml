structured-info:
  zh-CN:
    summary: 将有来源依据的产品功能转成界面连续变形、光标驱动的宣传动效，兼顾品牌识别与清晰演示。
    best-for:
    - APP 功能展示
    - 网站与 SaaS 演示
    - 产品发布短片
    how-to-use: 提供产品截图、网址或录屏，核验功能并确认视觉方向与节奏后制作。
    outputs: MP4 成片、可编辑源码、功能核验表、逐拍时间表与执行记录。
  en-US:
    summary: Turns source-backed product features into cursor-driven promotional motion with seamless interface morphs, balancing brand recognition and clear demonstrations.
    best-for:
    - App Feature Showcases
    - Website and SaaS Demos
    - Product Launch Shorts
    how-to-use: Upload screenshots, operation recordings or reference videos, or provide a URL or product name; align verified features and visual direction before approving the timeline.
    outputs: An MP4, editable source, feature verification table, beat-by-beat timeline and execution log.

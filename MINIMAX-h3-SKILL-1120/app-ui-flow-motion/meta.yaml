summary-en: For app and website launches and feature introductions, verifies real flows from screenshots, URLs or reference videos and creates loopable minimalist motion.
summary-cn: 适合 APP 与网站的产品发布和功能介绍，基于截图、网址或参考视频核验真实流程，制作可循环的极简动效。
desc-en: For teams presenting real app, website or SaaS features, accepts screenshots, operation recordings, reference videos, URLs or product names, plus format, duration and music requirements. It first verifies features, copy and interaction feedback against user materials and official sources, recording evidence and gaps. After confirming brand-faithful or minimalist redrawing, it plans beats, codes seamless interface morphs and synchronizes motion to rhythm. Deliverables include an MP4, editable source, feature verification table and timeline; analysis or planning alone is also supported. It does not invent product capabilities or bypass login restrictions, and is not for live-action ads or ordinary web development. Access to real sites depends on available browsing capabilities and user permissions.
desc-cn: 适合需要展示真实 APP、网站或 SaaS 功能的团队。可上传截图、操作录屏、参考视频，提供网址或产品名称，补充画幅、时长和音乐。先从用户素材与官方资料核验功能、文案和操作反馈，记录来源，再确认品牌还原或极简重绘方向，规划逐拍时间表，用代码绘制连续变形的界面并对齐节奏。交付 MP4、可编辑源码、功能核验表和时间表，也可只做分析或方案。不编造产品功能、不绕过登录权限，不用于真人广告或普通网页开发。

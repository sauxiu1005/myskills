<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择画风与真人手部</title><style>body{font:16px system-ui;max-width:1200px;margin:32px auto;padding:20px;background:#f7f5f0;color:#263343}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}label{display:grid;gap:8px;background:white;padding:12px;border:2px solid #ddd;border-radius:12px;cursor:pointer}label:has(input:checked){border-color:#396aa4}img{width:100%;height:190px;object-fit:contain}button{margin:20px 12px 10px 0;padding:12px 20px}textarea{width:95%;height:130px}input{accent-color:#396aa4}</style><h1>选择画风与真人手部</h1><p>两项均需选择，无预选、无倒计时。完成后把结果交给制作助手。真人质感手部为图像预设，不宣称实拍。</p><form id="picker"><h2>1. 画风</h2><div class="grid"><label><input required type="radio" name="style" value="1"><img src="style-previews/01-minimal-stickman.jpg" alt="1 · 极简黑白火柴人"><span>1 · 极简黑白火柴人</span></label><label><input required type="radio" name="style" value="2"><img src="style-previews/02-black-bean-doodle.jpg" alt="2 · 黑豆小人涂鸦"><span>2 · 黑豆小人涂鸦</span></label><label><input required type="radio" name="style" value="3"><img src="style-previews/03-warm-pastel-storybook.jpg" alt="3 · 暖调色粉童话"><span>3 · 暖调色粉童话</span></label><label><input required type="radio" name="style" value="4"><img src="style-previews/04-ink-wash-bird-bamboo.jpg" alt="4 · 写意水墨花鸟"><span>4 · 写意水墨花鸟</span></label><label><input required type="radio" name="style" value="5"><img src="style-previews/05-retro-animation-character.jpg" alt="5 · 复古动画角色"><span>5 · 复古动画角色</span></label><label><input required type="radio" name="style" value="6"><img src="style-previews/06-crayon-kid-doodle.jpg" alt="6 · 蜡笔童趣涂鸦"><span>6 · 蜡笔童趣涂鸦</span></label><label><input required type="radio" name="style" value="7"><img src="style-previews/07-retro-cozy-picturebook.jpg" alt="7 · 复古治愈绘本"><span>7 · 复古治愈绘本</span></label><label><input required type="radio" name="style" value="8"><img src="style-previews/08-retro-warm-picturebook.jpg" alt="8 · 复古暖调绘本"><span>8 · 复古暖调绘本</span></label><label><input required type="radio" name="style" value="9"><img src="style-previews/09-oil-pastel-kids.jpg" alt="9 · 油画棒童趣卡通"><span>9 · 油画棒童趣卡通</span></label><label><input required type="radio" name="style" value="10"><img src="style-previews/10-american-cartoon-ink.jpg" alt="10 · 美式卡通描线"><span>10 · 美式卡通描线</span></label><label><input required type="radio" name="style" value="11"><img src="style-previews/11-hardboiled-ink-comic.jpg" alt="11 · 硬派黑白墨线漫画"><span>11 · 硬派黑白墨线漫画</span></label><label><input required type="radio" name="style" value="12"><img src="style-previews/12-industrial-marker-sketch.jpg" alt="12 · 工业设计马克笔手绘"><span>12 · 工业设计马克笔手绘</span></label><label><input required type="radio" name="style" value="13"><img src="style-previews/13-anime-cel-portrait.jpg" alt="13 · 日系赛璐珞立绘"><span>13 · 日系赛璐珞立绘</span></label></div><h2>2. 真人质感手部或仅画笔</h2><div class="grid"><label><input required type="radio" name="hand" value="navy"><img src="hands/navy.png" alt="深蓝袖马克笔"><span>深蓝袖马克笔</span></label><label><input required type="radio" name="hand" value="diamond-woman"><img src="hands/diamond-woman.png" alt="白皙长甲镶钻女手"><span>白皙长甲镶钻女手</span></label><label><input required type="radio" name="hand" value="child-pencil"><img src="hands/child-pencil.png" alt="儿童彩铅手"><span>儿童彩铅手</span></label><label><input required type="radio" name="hand" value="waner-brush"><img src="hands/waner-brush.png" alt="上官婉儿灵感毛笔"><span>上官婉儿灵感毛笔</span></label><label><input required type="radio" name="hand" value="teacher-pen"><img src="hands/teacher-pen.png" alt="白衬衫讲师中性笔"><span>白衬衫讲师中性笔</span></label><label><input required type="radio" name="hand" value="cardigan-fountain"><img src="hands/cardigan-fountain.png" alt="针织袖经典钢笔"><span>针织袖经典钢笔</span></label><label><input required type="radio" name="hand" value="pen-only"><img src="hands/pen-only.png" alt="仅画笔（无真人手部）"><span>仅画笔（无真人手部）</span></label></div><button type="submit">生成选择结果</button></form><textarea id="result" readonly placeholder="选完两项后显示结果"></textarea><br><button id="copy" disabled>复制结果</button><button id="download" disabled>下载选择JSON</button><p id="notice"></p><script>
const result=document.querySelector('#result');let payload=null;
document.querySelector('#picker').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);if(!d.get('style')||!d.get('hand'))return;payload={style:{mode:'catalog',catalog_id:d.get('style')},hand:d.get('hand')};result.value=JSON.stringify(payload,null,2);document.querySelector('#copy').disabled=false;document.querySelector('#download').disabled=false;document.querySelector('#notice').textContent='请复制或下载结果并提交给制作助手，页面不会自动写入任务。';});
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.value);document.querySelector('#notice').textContent='已复制，请提交给制作助手。';}catch(e){result.select();document.querySelector('#notice').textContent='请手动复制已选中的结果。';}};
document.querySelector('#download').onclick=()=>{if(!payload)return;const u=URL.createObjectURL(new Blob([result.value],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='handdraw-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>

    best-for:
      - 液态品牌片头
      - 产品宣传字标
      - 转场包装
    how-to-use: 输入品牌名或主标题，选择是否添加副标及其语言后开始制作。
    outputs: 十秒液态字标视频、含节拍表与实测指标的简短报告及独立评审建议。
  en-US:

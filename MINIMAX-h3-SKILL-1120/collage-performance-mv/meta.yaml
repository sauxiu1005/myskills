summary-en: Turn a creative prompt, music and character references into a music video that blends lead-singer performance with flat collage graphics and beat-synced kinetic lyrics.
summary-cn: 将创意提示、音乐与角色参考制作成主唱演唱表演与平面拼贴、节拍动态歌词相结合的音乐 MV。
desc-en: For musicians, creators and K-pop or character fans who want a music video where a lead singer performs inside flat collage design. Users provide a required creative prompt plus music, visual and character references, or generate missing ones in-platform. The workflow locks and analyzes the music, builds a project moodboard and multi-view character sheet, plans which vocal sections appear as lead video, drives lip-synced half-body and close-up performances with the original mix, then composites cutouts, paper textures and kinetic lyrics in code with characters always on top. It delivers a clean, low-noise MP4 in the project, production boards and an editable project, with the user approving each video batch. Not for static slideshows or single character images.
desc-cn: 面向音乐人、视频创作者和 K-pop 或角色爱好者，用于制作主唱在平面拼贴设计中演唱表演的音乐 MV。用户需提供创意提示，并上传音乐、视觉与角色参考，缺少时可在平台内生成。流程先锁定并分析音乐，制作本次情绪板与多视图角色卡，规划哪些唱段以主唱视频出镜，用原混音驱动半身与特写的演唱口型，再以代码合成人物贴图、纸纹拼贴和动态歌词，并保证人物始终在最上层。最终交付低噪点成片、制作板与可编辑工程，视频由用户查看确认。不适用于静态幻灯片或单张角色图。

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手机 UI 演示 · 镜头总览</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#22294b,#090d1e 65%);color:#f4f5ff;font:16px -apple-system,'PingFang SC',sans-serif;min-height:100vh;padding:70px 8vw}small{letter-spacing:3px;color:#8ca2df}h1{font-size:48px;margin:20px 0}p{color:#a1aec8}a{color:inherit;text-decoration:none}.play{display:inline-block;padding:15px 25px;background:#637ae8;border-radius:16px;margin:18px 0 40px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.card{padding:28px;border:1px solid #ffffff18;border-radius:24px;background:linear-gradient(150deg,#ffffff0d,transparent);box-shadow:inset 0 3px var(--c)}.card h2{font-size:23px;line-height:1.5}.card span{font-size:13px;color:#a3b3d7}footer{margin-top:48px;color:#7c8ba9;font-size:13px}
</style></head><body><small>PHONE UI STORIES / STORYBOARD</small><h1 id="title"></h1><p>一台手机，五段学习故事。此示例用于演示模板与视频导出。</p><a class="play" href="film.html">播放完整影片 →</a><div class="cards" id="cards"></div><footer>Space 暂停 / R 重播 / ← → 切换镜头 / 鼠标移到底部显示控制栏</footer><script src="story.js"></script><script>
document.querySelector('#title').textContent=STORY.title;STORY.shots.forEach((s,i)=>{const a=document.createElement('a');a.href='film.html?shot='+i;a.className='card';a.style.setProperty('--c',s.color);const n=document.createElement('small');n.textContent=String(i+1).padStart(2,'0')+' / '+s.scene.toUpperCase();const h=document.createElement('h2');h.textContent=s.title;const t=document.createElement('span');t.textContent=s.start+'–'+(s.start+s.duration)+'s · '+s.duration+' 秒';a.append(n,h,t);document.querySelector('#cards').append(a)});
</script></body></html>

summary-en: Turn product features, copy or screenshots into phone UI demo videos, delivering synchronized sound, editable source, an animation preview and storyboards.
summary-cn: 将产品功能、文案或界面截图制作成手机界面演示视频，交付同步音效成片、可编辑源码、动画预览与分镜。
desc-en: For teams creating app demos, phone screen-recording style promotions or interface explainers. Supply a topic, feature copy or screenshots and specify duration, framing and sound. The workflow settles specifications and storyboards, rebuilds notifications, chats, settings and data displays as editable web animation, synthesizes system sounds and exports video. Receive the film, single-file preview, source package, keyframes and storyboard, with revisions by timecode. It does not operate real phone accounts or produce live-action footage.
desc-cn: 面向需要应用演示、手机录屏风格宣传片或界面知识讲解的团队。提供主题、功能文案或截图，补充时长、画幅和声音要求。流程确定规格与分镜，将通知、聊天、设置和数据展示重建为可编辑网页动画，合成系统音效并导出视频。交付成片、单文件预览、源码包、关键帧与分镜，可按时间码修改。不操作真实手机账号，也不制作真人实拍。

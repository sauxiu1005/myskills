summary-en: Turn an idea or script into a code-drawn sci-fi comedy animated short with voice-driven mouths, score, subtitles, and editable source.
summary-cn: 将创意或剧本制作成代码绘制的科幻喜剧动画短片，含声音驱动口型、配乐字幕与可编辑源码。
desc-en: For creators making original sci-fi sitcoms, two-character dialogue or parallel-world shorts, this workflow accepts an idea or script and optional characters, language, duration and aspect ratio. It develops the story and treatment, creates character sheets and style frames, then draws thick-line, flat-color animation in code. Recorded dialogue drives mouth movements while a shared timeline coordinates picture, voices, music, sound effects and subtitles. After rendering, it checks the finished picture and sound. Deliverables include the playable video, cover, subtitles, treatment, credits and editable source with a build script. It supports new shorts and revisions, not image-to-video, 3D or live action; production depends on available rendering and audio tools.
desc-cn: 面向需要原创科幻情景喜剧、双人对白或平行世界短片的创作者，用户可提供创意或剧本，并指定角色、语言、时长与画幅。流程先编写故事与导演方案，制作角色设定和风格帧，再以代码绘制抖动粗线、平涂上色的动画，让逐句录音驱动口型，统一编排画面、配音、配乐、音效和字幕，渲染后检查音画。交付成片、封面、字幕、导演方案、来源清单、可编辑源码与构建脚本。支持新作和修改，不用于图生视频、三维或真人实拍；制作依赖可用的渲染和声音工具。

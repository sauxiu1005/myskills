structured-info:
  zh-CN:
    summary: 为萌宠、日常、访谈或搞笑素材设计节奏明确的综艺花字动画，并完成音效卡点与成片导出。
    best-for:
      - 综艺花字
      - 萌宠日常
      - 访谈搞笑
    how-to-use: 提供照片或视频、文案与配色，确认画幅和节奏后审核关键帧再导出。
    outputs: 十秒综艺花字 MP4、制作报告与授权说明。
  en-US:
    summary: Turn pet, daily, interview or comedy footage into a rhythmic variety-show caption animation with synced sound and a finished export.
    best-for:
      - Variety Captions
      - Pet Daily Vlogs
      - Interview Comedy
    how-to-use: Provide footage, copy and colours, confirm framing and rhythm, then review keyframes before export.
    outputs: A ten-second variety-caption MP4, production report and credits.

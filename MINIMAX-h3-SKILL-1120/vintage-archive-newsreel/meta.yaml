summary-en: "Cut verified archive film, newspaper scans and period records into a 1920s sound newsreel with a measured announcer, original hot jazz, code rendering and canvas delivery."
summary-cn: "用核验许可的真实档案影片、报刊和唱片，制作1920年代风格有声新闻短片：导演方案、实测播报、原创热爵士、银灰胶片渲染，并检查字幕、声画同步与响度。"
desc-en: "A Design-native port of the lemo-opuscar 1920s newsreel style for history stories, era trends and anniversary features told as an early sound newsreel. Provide a topic, any archive footage, photos, papers or recordings you own, plus language, length and whether you want a storyboard review. The Skill verifies real material and licences first, writes its own treatment, proves the look with code style frames on real footage, records and measures narration, composes original hot jazz and foley, edits everything on one timeline, renders frame by frame with platform runtimes and runs reading, sync, decode and loudness QA. It delivers the film, poster, subtitles, sources, facts and an editable project. It never fakes archive material with generated images or video and is not a silent-film or filter style."
desc-cn: "面向历史故事、时代风潮与纪念专题，把主题做成早期有声新闻片。用户提供主题、自有档案或录音，及语言、时长和是否审核故事板。流程先核验真实素材与许可并记录事实来源，写独立导演方案，用真实素材渲染代码风格帧，实测配音，创作原创热爵士与音效，统一时间轴剪辑，复用平台运行时逐帧渲染并做阅读、声画、解码与响度检查。交付成片、海报、字幕、来源事实和可编辑工程；彩色真实片统一暖银灰。不用生成内容伪造档案，不做默片或复古滤镜。"
author-en: MiniMax Design
author-cn: MiniMax Design

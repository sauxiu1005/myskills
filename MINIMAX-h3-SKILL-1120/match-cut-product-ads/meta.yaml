summary-en: Turns product facts and one core benefit into shape and motion relays across scenes, then stills, clips, a beat-cut edit, accurate typography and a mixed soundtrack, delivered as a versioned canvas film.
summary-cn: 从产品信息和核心卖点出发，设计跨场景的形状与动作接力，完成定帧、视频、卡点剪辑和混音，在画布交付分版本的成片。
desc-en: For brands and creators who want a product ad whose scenes hand one shape, framing or motion to the next. Provide a product image or link, the product name and a core benefit, plus any duration, format, language or style preferences. The workflow researches official facts, plans relay pairs that link a real-world action to the product experience, builds stills and clips with Design's available models or code compositing, cuts on measured music beats, adds accurate text and logo, mixes to about -14 LUFS, and imports each version as a new canvas node with records written back. It delivers the film, storyboard, prompts, configs, scripts and QA notes. Best for match-cut launches, hero shots and targeted revisions; it does not invent product claims or handle narrative films without a product.
desc-cn: 面向需要让场景以形状、构图或动作接力衔接的产品广告。用户提供产品图或链接、产品名称和一个核心卖点，可补充时长、画幅、语言和风格。流程先核对官方信息，设计连接现实动作与产品体验的接力分镜，用 Design 可用模型或代码合成制作定帧与视频，按实测节拍剪辑，后期叠加文字与标志并混音，每个版本作为新画布节点导入。交付成片、分镜、提示词、剪辑配置、脚本和质检记录。适合匹配转场新品片、产品主镜头和定向修改，不编造产品功能，也不用于没有产品的剧情片。

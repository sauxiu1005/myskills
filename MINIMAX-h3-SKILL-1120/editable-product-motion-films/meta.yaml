summary-en: Build product information into a code-driven motion film through three direction frames, a beat storyboard and music, delivering an MP4, a standalone playable preview and editable source for launches and feature demos.
summary-cn: 根据产品资料先出三个方向关键帧与节奏分镜，再用代码动画和配乐制作成片，交付视频、独立可播预览与可编辑源码。
desc-en: For teams that need a product launch film, feature demo or data explainer whose every title, number and UI element stays editable. Provide product information, logo, screenshots or recordings, and optionally duration, aspect ratio, music or narration. The workflow checks local tools, locks the delivery spec, renders three genuinely different direction frames for you to choose, writes a treatment with a beat table and builds a representative segment for approval, then completes the full HTML / GSAP animation with local scoring, existing music or narration, exports the video and packages a single-file preview. You receive the MP4, a standalone playable preview, the editable source package and the treatment, and can refine any timecode or object later. It does not make live-action drama or prompt-only outputs.
desc-cn: 面向需要产品发布片、功能演示或数据解释动画，并希望文字、数字和界面元素可随时修改的团队。用户提供产品介绍、Logo、截图或录屏，可补充时长、画幅与声音要求。流程先检查本机工具并锁定规格，渲染三个真正不同的方向关键帧供选择，写出含节拍表的创作方案并确认代表段，再用 HTML 与 GSAP 制作全片，对齐配乐或旁白，导出视频并打包单文件预览。交付成片、独立可播预览、可编辑源码包和创作方案，之后可按时间码局部修改。不用于真人剧情片，也不只输出视频提示词。

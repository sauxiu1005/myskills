structured-info:
  zh-CN:
    summary: 将文案或话题变成角色一致、节奏清晰的火柴人动画短片，并在制作前确认旁白、字幕和配乐。
    best-for:
      - 火柴人短片
      - 知识讲解
      - 故事动画
    how-to-use: 提供文案或话题，确认画幅、时长、旁白、字幕与配乐，再审核关键帧。
    outputs: 火柴人视频、角色参考、关键帧与可复用制作素材。
  en-US:
    summary: Turn copy or a topic into a consistent-character stickman short, confirming narration, subtitles and music before production.
    best-for:
      - Stickman Shorts
      - Knowledge Explainers
      - Story Animation
    how-to-use: Provide copy or a topic, confirm framing, duration, narration, subtitles and music, then review keyframes.
    outputs: Stickman video, character references, keyframes and reusable production assets.

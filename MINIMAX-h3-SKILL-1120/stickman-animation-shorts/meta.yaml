summary-en: "Turns copy or topics into approved stickman short films with consistent characters, keyframes and edits, confirming narration language, subtitles and music before video production."
summary-cn: "将文案或话题制作成人物一致的火柴人短片，先确认提案与关键帧，以及旁白语言、字幕和配乐，再生成视频并合成。"
desc-en: "This Skill helps creators turn copy, notes, articles or topics into stickman explainers and story shorts. Provide source material, aspect ratio, duration and a choice among five independent visual styles. Before video production, explicitly confirm whether narration, subtitles and music are wanted, including spoken and subtitle languages and musical direction. Review the director’s proposal, approve reusable character references, then approve shot keyframes. MiniMax H3 generates the approved segments by default; after clip review, the workflow assembles the film and adds only authorized subtitles and music. Deliverables include the final video and reusable production assets, or a prompt package when requested."
desc-cn: "面向知识讲解、观点表达与故事短片创作者，将文案、笔记、文章或话题制作成火柴人视频。用户提供素材、画幅和时长，并从五种独立画风中选择；生成前明确确认旁白是否需要及语言、字幕是否需要及语言形式、配乐是否需要及方向。流程依次确认导演提案、角色参考与镜头关键帧，默认使用 MiniMax H3 分段生成，片段审阅后拼接并添加获批字幕和配乐。交付成片及可复用素材，也支持仅提示词。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official-featured

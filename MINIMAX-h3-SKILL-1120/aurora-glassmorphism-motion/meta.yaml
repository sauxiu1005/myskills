display-name-zh: 玻璃拟态动效
version: 1.0.0
tag-en: Creative & Experimental
tag-cn: 创意实验
summary-en: Turns a brand, product, website or app into a short code-rendered aurora and glassmorphism film with frosted UI cards, a refracting liquid-glass lens and synthesized music, for tech launches and brand openers.
summary-cn: 基于品牌、产品、网站或 App，用代码渲染极光玻璃拟态短片，透镜真实折射界面文字并配乐，适用于科技发布与品牌开场。
desc-en: A motion-design workflow for tech brands and creators who want the slow, translucent Liquid Glass look without AI video models. Provide a brand or product idea, optional copy, UI language, palette or logo; the workflow can also invent a fictional brand. It writes a treatment with UI copy, a timecoded beat sheet and palette for approval. A coding agent then builds a WebGL project where a liquid-glass lens truly bends the cards and text, and first renders a key visual and keyframes for approval. Then it adds motion and synthesized music, renders, encodes against banding and runs an independent review. It delivers an MP4 and a production report. Best for product, website and app launches or brand openers; not for long films, live action or dense fast-cut content.
desc-cn: 面向想要「慢、透、高级」液态玻璃质感、又不用生视频模型的科技品牌与创作者。用户提供品牌或产品构想，可附文案、界面语言、配色或 Logo，也可让流程虚构品牌。流程先出含界面文案、节拍表和配色的创意方案供确认；再由编码子 agent 搭建 WebGL 工程，先渲染主视觉与关键帧供确认，让透镜真正折射卡片和文字；确认后加动画与合成配乐，逐帧渲染、防色带编码并独立评审。交付 MP4 成片与制作报告。适合产品、网站与 App 发布及品牌开场；不适合长片、实拍或快节奏信息密集内容。

structured-info:
  zh-CN:
    summary: 按媒介选择编剧方法，把故事点子或已有稿件推进到用户指定的开发、诊断或修订交付。
    best-for:
    - 影视剧本开发
    - 文本诊断修订
    - 舞台与戏曲
    how-to-use: 提供点子或稿件，说明需要创意方向、大纲、正文还是修改，并列出必须保留的条件。
    outputs: 故事方案、人物关系、结构大纲、剧集设定、对白稿、格式化剧本与修订方案。
  en-US:
    summary: Choose the relevant writing methods to move an idea or draft to the requested development, diagnosis, or revision deliverable.
    best-for:
    - Screenwriting development
    - Draft diagnosis and revision
    - Stage and opera
    how-to-use: Provide an idea or draft, specify whether you need concepts, an outline, pages, or revision, and state fixed constraints.
    outputs: Story options, character relationships, structural outlines, series bibles, dialogue pages, formatted scripts, and revision plans.

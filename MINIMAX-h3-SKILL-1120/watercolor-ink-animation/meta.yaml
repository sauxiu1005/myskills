summary-en: From a story idea or a song, write a storyboard, paint every frame in watercolour and ink with code, check it on contact sheets, and render a beat-synced MP4, sample first and full film on approval.
summary-cn: 根据故事构想或歌曲编写分镜，用代码逐帧绘制水彩水墨画面并对拍审查，先出样片再渲染完整的水彩水墨动画成片。
desc-en: For creators making watercolor-and-ink cartoons, music videos, lyric animations or seamless loops. Provide a story idea or lyrics, optionally adding music, an LRC timeline, characters or a visual direction. The workflow checks the soundtrack mood and measures its tempo, writes a complete storyboard with timed reading beats, and builds each shot as deterministic drawing code. It reviews contact sheets and frame sequences, renders a representative sample, and extends the approved sample into the full film. Deliver a 1080p MP4 with the selected music and an editable project. The medium supports character acting, match cuts and rhythmic motion in flat 2D; it uses no image or video generation models or real 3D camera work.
desc-cn: 面向需要水彩水墨卡通、音乐短片、歌词动画或循环动图的创作者。提供故事或歌词，可附音乐、歌词时间轴、角色和风格方向。先检查配乐情绪与实测节拍，编写带理解节奏的完整分镜，再以确定性代码逐帧绘制，检查联系表和动作序列。先渲染代表样片，确认后扩展整片，交付带所选音乐的高清视频与可编辑工程。适合平面二维角色表演、匹配转场与卡点运动，不调用图像或视频生成模型，不制作真实三维运镜。

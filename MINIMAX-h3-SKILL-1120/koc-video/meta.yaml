summary-en: "Generate creator-native KOC and UGC commerce videos for domestic and cross-border social platforms, including reviews, POV, talking heads, and virtual hosts"
summary-cn: "生成 KOC 与 UGC 达人种草和带货视频，覆盖出海、测评、口播、POV 与数字人栏目"
desc-en: "For brands and creators producing creator-native social content for domestic and cross-border commerce: product seeding, short-form selling videos, creator talking heads, product reviews, customer stories, faceless POV, digital humans, and virtual characters. Built for Douyin, Xiaohongshu, TikTok, and Reels content aimed at engagement, follows, inquiries, or conversion. A physical product and a real person on camera are not always required. The workflow covers creative direction, scripting and visual planning, video generation, and final delivery. Not for brand films, serialized drama, or ordinary videos without an audience action goal."
desc-cn: "面向品牌与创作者的达人原生内容生产入口，生成种草、短视频带货、出海社媒营销、创作者口播、产品测评、用户口碑、无脸视角、数字人与虚拟角色等内容。适用于抖音、小红书、TikTok、Reels 等平台中的互动、关注、咨询或转化目标，产品与真人出镜都不是前提条件。流程覆盖创意方向、脚本与画面规划、视频生成与成片交付，不适用于品牌大片、连续剧情或没有受众行动目标的普通视频。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将产品事实和目标受众转化为种草、带货、出海、测评、口播或 POV 等达人原生社交视频。
    best-for:
      - KOC种草
      - 出海带货
      - 产品测评
    how-to-use: 提供产品资料、受众、平台和素材，Agent先形成方向，只在关键分叉或信息缺口时请你选择。
    outputs: 产品事实表、脚本与镜头表、原生表达方案、视频素材及种草成片。
  en-US:
    summary: Turn product facts and audience context into creator-native KOC and UGC videos for seeding, social commerce, cross-border marketing, reviews, talking-head, or POV formats.
    best-for:
      - KOC Seeding
      - Cross-border Commerce
      - Product Reviews
    how-to-use: Provide product context, audience, platform, and assets; the Agent forms a direction and asks only at key creative forks or when essential information is missing.
    outputs: A product fact sheet, script and shot list, native delivery direction, video assets, and the finished seeding video.

summary-en: Create a unified 3D animated short from a story idea, covering characters,
  scenes, shots, storyboards, video clips, and final assembly.
summary-cn: 根据故事创意，完成人物与场景设定、镜头规划、分镜生成和视频合成，输出风格统一的3D动画短片。
desc-en: Designed for creators who want to turn a short story idea into a complete
  stylized 3D animated film. The user provides a premise, target duration, aspect
  ratio, tone, and audio mode. The Skill guides the workflow through project brief,
  story outline, character cards, transformation-form anchors, environment cards,
  continuity-safe shot table, text storyboards, MiniMax H3 video clips by default,
  BGM, final assembly, and quality review. It is best for Pixar-like, Disney-like,
  Q-version, and motion-graphics-inspired animated shorts, not for single images,
  photoreal live action, logo animation, or one-off unrelated video clips.
desc-cn: 面向希望把一句故事创意做成完整风格化3D动画短片的创作者。用户提供故事前提、时长、画幅、视觉基调和音频模式后，Skill 会依次完成项目简报、故事大纲、角色卡、变身形态锚点、场景卡、连续性安全镜头表、文本分镜、默认
  MiniMax H3 单说话人视频片段、配乐、成片合成与质量复查。适合皮克斯感、迪士尼感、Q版和动态图形风短片，不适合单图、真人写实、Logo 动效或无关联单镜头视频。
structured-info:
  zh-CN:
    summary: 将故事创意转化为风格统一、角色连贯的完整3D动画短片，并输出成片。
    best-for:
    - 风格化3D
    - 故事短片
    - 角色动画
    how-to-use: 提供剧本或故事创意，选择时长、画幅和美术风格后开始制作。
    outputs: 角色场景设定、镜头表、分镜及完整3D动画视频。
  en-US:
    summary: Turn a story idea into a unified, character-consistent 3D animated short
      and deliver the finished film.
    best-for:
    - Stylized 3D
    - Story Shorts
    - Character Animation
    how-to-use: Provide a script or story idea, then choose duration, framing, and
      visual style to begin.
    outputs: Character and scene designs, shot list, storyboard, and finished 3D animation
      video.

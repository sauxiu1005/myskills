structured-info:
  zh-CN:
    summary: 将主题、文章或研究资料转成先确认方案、再生成旁白字幕和拼贴动效的完整科普解释视频。
    best-for:
    - 科普解释
    - 拼贴动效
    - 旁白字幕
    how-to-use: 提供主题、正文或资料，先确认语言、受众、时长、画幅和制作方案。
    outputs: 制作计划、脚本、分镜、关键帧、拼贴动画、旁白字幕与解释视频成片。
  en-US:
    summary: Turn a topic, article, or research source into a confirmation-first explainer
      with narration, subtitles, and collage motion.
    best-for:
    - Explainer Videos
    - Collage Motion
    - Narration and Captions
    how-to-use: Provide the topic, copy, or research, then confirm language, audience,
      duration, framing, and production plan.
    outputs: A production plan, script, storyboard, keyframes, collage animation,
      narration, captions, and finished explainer.

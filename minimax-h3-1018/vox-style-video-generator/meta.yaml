summary-en: Turns topics and source documents into reviewed Vox-style explainers using
  default Paper Collage or optional Cutout Character motion, with logical non-character
  object entry, narration, music, and final assembly.
summary-cn: 将主题或资料制作成经过审核的 Vox 风格解释视频，默认使用 Paper Collage，用户可选 Cutout Character，并先确认逐帧物品入场动效方案。
desc-en: Turn a topic, article, report, or transcript into an approval-first collage
  or cutout explainer with keyframes, motion planning, narration, music, and assembly.
  Best for science, documentary, and education videos.
desc-cn: 将主题、文章、报告或逐字稿转成先审核方案、关键帧和动效计划，再生成旁白、音乐与拼贴/剪纸动画的科普解释视频。适合科普、纪录和教育视频论文，不适用于虚构长片、普通剪辑或跳过审核的直接生成。

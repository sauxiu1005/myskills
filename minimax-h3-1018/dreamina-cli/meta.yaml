structured-info:
  zh-CN:
    summary: "把自己即梦账号里的积分用于图片和视频创作，直接在当前画布接收结果并查看剩余积分。"
    best-for: ["即梦积分创作", "参考素材生成", "任务恢复"]
    how-to-use: "说明要用自己的即梦账号或积分，描述目标并附参考素材，按需登录授权。"
    outputs: "按内容命名的图片或视频画布资产，以及生成后的即梦积分余额。"
  en-US:
    summary: "Use credits in your own Jimeng account for image and video creation, receive results directly on the current canvas and see your remaining balance."
    best-for: ["Creation with Jimeng credits", "Reference-guided generation", "Task recovery"]
    how-to-use: "Ask to use your own Jimeng account or its credits, describe the result, attach references and authorize login if needed."
    outputs: "Descriptively named image or video canvas assets and the remaining Jimeng credit balance after generation."

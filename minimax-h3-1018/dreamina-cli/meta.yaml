summary-en: "Spend credits in your own Jimeng account to turn text requests and reference media into images or videos delivered directly to the current canvas."
summary-cn: "使用自己即梦账号中的积分，将文字需求和参考素材生成图片或视频，并直接交付到当前画布。"
desc-en: "Generate or edit images and videos from text requests or reference media using credits in your own Jimeng account, and receive the results directly on the current canvas. For creators who want to use their Jimeng balance in this workspace, the workflow guides login when needed, checks generation capabilities, tracks queues and progress, resumes interrupted tasks, names delivered media and reports remaining credits. Before video submission, it explains standard queueing, membership acceleration and additional credits. Use it only when explicitly requesting your own Jimeng account or credits; brand or model names such as Jimeng, SD or Seedance alone stay with built-in services. Availability depends on Jimeng membership, credits and model capabilities."
desc-cn: "使用自己的即梦账号积分，把文字需求或参考素材生成、编辑为图片和视频，并直接交付到当前画布。适合希望在画布中使用即梦余额完成创作的用户：按需引导登录、核对生成能力、追踪排队与进度，中断后恢复原任务，完成后为素材命名并报告剩余积分。视频提交前说明普通排队或会员加速及额外积分。仅在用户明确要求使用自己的即梦账号或积分时启用；仅提到即梦、SD／Seedance 等名称仍走内置能力。使用受即梦会员、积分和模型能力限制。"
author-en: "MiniMax Hub"
author-cn: "海螺Hub"
source: official

summary-en: "Correct speech recognition errors in SRT subtitles while strictly preserving timeline and numbering."
summary-cn: "修正 SRT 字幕语音识别错误，严格保留时间轴和编号。"
desc-en: "Subtitle Correction fixes speech-recognition errors in SRT files while strictly preserving all timestamps and subtitle numbering. Interactively asks the user for domain-specific terminology first — proper nouns, technical terms, framework names — then applies domain-aware corrections tuned for that vocabulary. Covers Chinese phonetic confusions, technical term misrecognitions, English-Chinese mixed content, and code identifier spelling. Ships a subtitle_tool.py validator, diff viewer, and HTML report generator for structured review before finalizing changes."
desc-cn: "字幕修正修 SRT 文件里的语音识别错误，严格保留所有时间戳和字幕编号。会先向用户索取领域术语——专有名词、专业术语、框架名——然后按该词汇领域调优做修正。覆盖中文谐音混淆、专业术语误识、中英文混排、代码标识符拼写。附带 subtitle_tool.py 校验器、diff 查看器和 HTML 报告生成器，方便修改定稿前做结构化 review。适合技术教程、AI/ML 课程等带专业术语的字幕修正。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 在严格保留时间轴和编号的前提下，结合领域术语修正SRT语音识别错误并生成可复核结果。
    best-for:
      - SRT修正
      - 术语校对
      - 时间轴保护
    how-to-use: 提供SRT文件和领域术语，先确认术语优先级与需要重点复核的片段。
    outputs: 修正后的SRT、术语变更清单、差异报告与HTML复核结果。
  en-US:
    summary: Correct speech-recognition errors in SRT files using domain terminology while strictly preserving timestamps and numbering.
    best-for:
      - SRT Repair
      - Term Proofing
      - Timeline Safety
    how-to-use: Provide the SRT file and domain terms, then confirm term priority and segments requiring focused review.
    outputs: A corrected SRT, terminology change log, diff report, and HTML review output.

  zh-CN:
    summary: 以角色与环境锚点建立中式仙宫世界，制作保持空间连续性的影视镜头、游戏宣传片或概念设计板。
    best-for:
    - 仙宫影视
    - 游戏宣传
    - 概念设计
    how-to-use: 提供主题、角色或场景参考，选择制作方向并确认画幅与视觉媒介后开始。
    outputs: 影视视频或概念设计板、角色场景参考资产及质量报告。
  en-US:
    summary: Build Chinese celestial worlds with character and environment anchors for coherent film shots, game trailers or concept design boards.
    best-for:
    - Celestial Films
    - Game Trailers
    - Concept Design
    how-to-use: Provide a theme, character or scene reference, then confirm the production direction, framing and visual medium.
    outputs: Film or concept boards, character and environment reference assets, and quality reports.

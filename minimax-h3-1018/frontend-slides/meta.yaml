display-name-zh: 前端幻灯
version: 0.1.2
tag-en: "Platform Tooling"
tag-cn: "平台工具"
complete-tags-en:
  - "Education / Creative Generation"
complete-tags-cn:
  - "教育 / 创作生成"
summary-en: "Create distinctive, animation-rich HTML presentations from notes, content, or PPTX files with visual style previews and PDF/URL export."
summary-cn: "从零、笔记或 PPT 生成带动效 HTML 幻灯片，含风格预览与 PDF 导出。"
desc-en: "Frontend Slides creates distinctive, animation-rich HTML presentations that run entirely in the browser. Supports three modes: build from scratch, convert PPTX files, or enhance an existing HTML deck. Uses visual style previews so users pick aesthetics by seeing three concrete drafts rather than describing taste. Ships 12 curated style presets, a 34-template bold pack, viewport-safe fixed 16:9 stage, inline text editing, PDF export, and one-click Vercel deployment for sharing."
desc-cn: "前端幻灯用于生成完全在浏览器里运行、独具风格的动效 HTML 演示文稿。支持三种模式：从零创作、转换 PPTX 文件、增强已有 HTML deck。通过生成三份可视化风格预览让用户看着选审美，而不是说品味。内置 12 套精选风格预设、34 套 bold template pack、固定 16:9 视口安全舞台、浏览器内文本编辑、PDF 导出、以及一键部署到 Vercel 的分享方案。适合非设计师用户快速产出高质量演示文稿。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将主题、笔记或现有PPT转化为零依赖、带动效和风格预览的浏览器HTML幻灯片。
    best-for:
      - HTML幻灯片
      - 演示动效
      - PDF导出
    how-to-use: 提供主题、文字资料或PPT，先确认内容密度、视觉方向与展示场景。
    outputs: 演示结构、风格预览、单文件HTML幻灯片与可选PDF导出。
  en-US:
    summary: Turn a topic, notes, or an existing deck into a zero-dependency browser presentation with motion and style previews.
    best-for:
      - HTML Slides
      - Presentation Motion
      - PDF Export
    how-to-use: Provide the topic, source notes, or deck, then confirm content density, visual direction, and presentation context.
    outputs: A presentation structure, style preview, single-file HTML deck, and optional PDF export.

structured-info:
  zh-CN:
    summary: 通过元信息与高密度关键帧建立视频证据链，深度拆解AI视频并反推可执行的时间戳复刻提示词。
    best-for:
      - AI视频拆解
      - 关键帧证据
      - 复刻提示词
    how-to-use: 提供视频、截图或文字描述，先读取可见证据并确认拆解深度与复刻目标。
    outputs: 结构化拆解报告、镜头证据链、时间戳分镜、复刻提示词与分析结论。
  en-US:
    summary: Build an evidence chain from metadata and dense keyframes to deeply deconstruct AI video and derive executable timestamped recreation prompts.
    best-for:
      - AI Video Analysis
      - Keyframe Evidence
      - Recreation Prompts
    how-to-use: Provide the video, screenshots, or description, then read visible evidence and confirm analysis depth and recreation goal.
    outputs: A structured deconstruction report, shot evidence chain, timestamped storyboard, recreation prompts, and findings.

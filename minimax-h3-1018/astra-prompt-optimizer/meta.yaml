structured-info:
  zh-CN:
    summary: 从目标、旧指令或失败回答中整理清晰的任务要求，减少冲突与重复并保留必要约束和验收标准。
    best-for: [提示词编写, 指令诊断, 冗余精简]
    how-to-use: 提供任务目标、旧提示词或失败回答，并说明要改写还是仅作诊断。
    outputs: 独立可复制的优化提示词，或按请求提供的指令诊断。
  en-US:
    summary: Clarify goals, existing instructions, or failed responses into actionable prompts that reduce conflicts and repetition while preserving constraints and acceptance criteria.
    best-for: [Prompt Writing, Instruction Diagnosis, Prompt Simplification]
    how-to-use: Provide a goal, existing prompt, or failed answer, and specify rewriting or diagnosis only.
    outputs: A standalone copy-ready prompt or an instruction diagnosis when requested.

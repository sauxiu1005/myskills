summary-en: "Write, diagnose, and streamline Astra prompts by repairing conflicts, repeated confirmation, and unnecessary work while preserving key constraints."
summary-cn: "从零编写、改写、诊断和精简 Astra 提示词，修复逻辑冲突、反复确认和无谓重复，保留关键约束。"
desc-en: "For users who need to write Astra prompts from scratch, repair instructions that cause repeated confirmation or unnecessary work, or streamline old instructions without losing valid requirements. Provide a goal, draft prompt, failed response, or instruction set. The Skill identifies the real task and target, preserves facts, permissions, exact copy, and acceptance criteria, removes only justified duplication, and keeps missing evidence explicit. It returns one standalone copy-ready prompt by default, or a diagnosis when diagnosis is requested. It does not change platform configuration or claim that cleaner prompts prove downstream improvement."
desc-cn: "面向需要从零编写 Astra 提示词、修复导致反复确认或无谓重复的指令，或在保留有效要求的前提下精简旧指令的用户。用户可提供目标、旧提示词、失败回答或待审计指令；Skill 先定位真实任务与对象，保留事实、权限、准确文案和验收标准，只删除有依据的重复，并明确缺失证据。默认交付一份独立可复制提示词；用户只要求诊断时只交诊断。它不修改平台配置，也不把提示词更整齐当作下游效果提升证明。"
author-en: MiniMax Design
author-cn: MiniMax Design
source: official-featured
cover: https://cdn.hailuoai.com/prod/2026-09-17-01/video/1789580015893622613-1789580015870.mp4

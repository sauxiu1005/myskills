summary-en: Create evidence-based e-commerce artwork, deliver editable sources after approval, and optionally make a short promotional video.
summary-cn: 基于商品事实完成主图与详情图，用户定稿后交付分层源文件，并可按需制作宣传视频。
desc-en: Help merchants and designers turn product facts into evidence-based e-commerce visuals. Given packaging, specifications, audience, platform and references, the workflow builds an evidence ledger, extracts purchase reasons, plans page modules, and creates main and detail artwork with copy and typography. Users review the finished canvas work before any Photoshop reconstruction. Only explicitly approved versions unlock layered source production and delivery with previews. Promotional videos are optional. The workflow never invents product claims, certificates or sales, treats style approval as final artwork approval, replaces legal review, or hides unavailable production and delivery capabilities. It also keeps approved artwork, source evidence, and delivery decisions traceable throughout the project.
desc-cn: 面向商家与设计师，将商品资料转成有据可查的电商视觉成品。用户提供包装、参数、人群、平台和参考图后，先建立证据账本、提炼购买理由、规划页面，再在画布完成含文案与排版的主图和详情图。画布阶段完成审阅与美化；仅在用户最终确认具体成品版本后，才进入Photoshop重建分层、核对成品并交付可访问的源文件和预览。宣传视频按需制作。不编造功效、认证或销量，不把风格确认当成品定稿，也不替代法律审核或掩盖工具与交付限制。
author-en: MiniMax Design
author-cn: MiniMax Design

structured-info:
  zh-CN:
    summary: 从商品事实出发，规划并制作可审核的电商主图、详情图与可选宣传视频。
    best-for:
    - 商品主图
    - 平台素材
    - 分层源文件
    how-to-use: 提供商品资料、平台和参考图，先审核画布成品，确认具体版本后再制作分层源文件。
    outputs: 电商视觉成品、预览图、分层源文件及可选宣传视频。
  en-US:
    summary: Plan and produce reviewable e-commerce main images, detail pages and optional promotional videos from product facts.
    best-for:
    - Product listings and PDPs
    - Platform-ready artwork
    - Layered source delivery
    how-to-use: Provide product facts, platform and references, review the canvas artwork, then approve exact versions before layered source production.
    outputs: Finished e-commerce visuals, previews, layered sources and an optional promo video.

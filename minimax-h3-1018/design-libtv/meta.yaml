display-name-zh: LibTV 影像创作
version: 0.2.1
tag-en: Creative & Experimental / Creative Generation
tag-cn: 创意实验 / 创作生成
complete-tags-en:
  - Creative & Experimental / Creative Generation
complete-tags-cn:
  - 创意实验 / 创作生成
summary-en: Turn briefs, scripts and selected references into LibTV images and videos, continue existing projects, and return verified results to the canvas.
summary-cn: 将简报、剧本和选中参考制作成 LibTV 图片与视频，支持项目续作并将验证后的结果回传画布。
desc-en: For creators who choose LibTV, this workflow turns briefs, scripts and selected references into images or video. It checks the account connection, identifies the intended project and prepares references before planning shots or generating the requested output. It retains project and task identities internally, follows existing work through completion, reviews visual quality and imports durable creative results to the current canvas. Delivery includes verified media and a LibTV project link; internal records and logs stay off the canvas. Existing content and accepted versions are preserved. It requires available LibTV creation and import capabilities; connecting an account does not authorize paid generation or convert the remote editable project into local editable nodes.
desc-cn: 面向明确选择 LibTV 的创作者，接收简报、剧本和选中参考，制作图片或视频。先检查账户连接、确定目标项目并准备素材，再规划镜头或生成约定作品。内部保留项目与任务标识，追踪已有任务直至完成，检查视觉质量后将创作结果持久导入当前画布。交付验证后的媒体与 LibTV 项目链接，内部记录和日志不上画布，保留已有内容和已接受版本。需要可用的 LibTV 创作与导入能力；连接账户不代表授权付费生成，也不把远端可编辑项目转换成本地可编辑节点。
author-en: MiniMax Design
author-cn: MiniMax Design
source: official
structured-info:
  zh-CN:
    summary: 使用自己的 LibTV 账户，将创作想法与参考素材制作成图片或视频，支持已有项目续作并交付到当前画布。
    best-for:
      - 图片创作
      - 视频创作
      - 项目续作
    how-to-use: 描述作品并按需提供参考，确认模型与成品规格；需要登录时完成网页授权。
    outputs: 验证后的图片或视频画布资产，以及可继续创作的 LibTV 项目链接。
  en-US:
    summary: Use your own LibTV account to turn creative ideas and references into images or videos, continue existing projects, and deliver results to the current canvas.
    best-for:
      - Image creation
      - Video creation
      - Project continuation
    how-to-use: Describe the result, provide references as needed, and confirm the model and output specifications. Complete browser authorization when sign-in is required.
    outputs: Verified image or video assets on the canvas, plus a LibTV project link for continued creation.

summary-en: Create a continuity-locked bullet-time short from a script or idea, with orbital freeze shots, separated audio, and a reviewed final cut.
summary-cn: 从剧本或灵感出发制作连续统一的子弹时间短片，完成环绕冻结镜头、独立音频与审阅后的成片。
desc-en: For creators making narrative shorts around bullet-time, extreme slow motion, or a time-freeze action beat. Inputs may include an idea, script, storyboard, character and scene references, footage, and authorized voice material. The workflow guides story and style selection, locks a production specification, parses traceable shots, builds character, scene and prop references, and binds stable voices before generating connected shots with the approved model. It then creates independent music and narration layers and assembles a reviewed final cut. It is strongest for continuity-sensitive cinematic shorts and does not handle unrelated one-off clips, silent tests, or unauthorized voice imitation.
desc-cn: 面向希望制作子弹时间、极端慢动作或时间冻结动作短片的创作者，输入可以是灵感、剧本、分镜、角色与场景参考图、现成视频及授权音色素材。流程先引导故事与视觉风格选择，锁定制作规格，逐场逐镜解析并建立可追溯故事板，再制作角色三视图、场景四宫格和关键道具，绑定稳定角色音色，按确认的模型生成连续镜头，独立制作BGM与旁白并完成审阅后的成片合成。它适合重视角色、场景和声音连续性的叙事短片，不处理无关的简单片段、静音一次性测试或未经授权的音色模仿。

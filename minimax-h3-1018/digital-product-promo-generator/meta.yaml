summary-en: Turns verified product sources into reviewable cinematic promos with accurate
  UI storytelling, purposeful motion, rhythmic editing, and sound design.
summary-cn: 基于已验证的产品素材制作可审阅的电影感宣传片，准确呈现界面、运镜、节奏与声音。
desc-en: Turn a real product page, frontend project, screenshots, or recording into
  a reviewable product promo. Verify UI facts, plan shots, motion, text, rhythm, and
  sound, then generate and check fidelity. Best for launches and demos, not generic
  editing or invented claims.
desc-cn: 将真实产品页面、前端项目、截图或录屏转成可审阅的产品宣传片，先核验界面事实，再规划镜头、运镜、文字、节奏和声音，确认后生成并检查还原度与导出质量。适合发布片和功能演示，不用于通用剪辑或虚构产品声明。

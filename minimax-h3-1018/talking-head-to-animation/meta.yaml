summary-en: Turn speech media or scripts into clear illustrated explainers with optional original audio, subtitles, presenter insets, or BGM.
summary-cn: 将口播视频或文案制作成清晰的线稿讲解动画，可选保留原声、字幕、真人画中画或背景音乐。
name: talking-head-to-animation
desc-en: For educators, explainers, and content creators, turn talking-head footage or a script into a clear illustrated explainer. Provide speech media or copy and confirm framing, duration, language, and audio needs. The workflow reviews the script, plans storyboard beats, shared anchors, on-screen text, and asset relationships, then produces shots and checks pacing and meaning before assembly. It can preserve original audio and optionally add subtitles, a presenter inset, or background music, and can adapt visual relationships from an authorized reference video. It does not replace fact checking, silently change meaning, voice, or identity, or hide missing source material.
desc-cn: 面向教育、知识分享和内容创作者，将口播视频或文案转成清晰易懂的线稿讲解动画。用户提供口播素材或文案，确认目标画幅、时长、语言和声音需求；流程先校对脚本，再规划分镜、共享锚点、画面文字和素材关系，逐镜生成并在合成前检查内容与节奏。可按需求保留原声，添加字幕、真人画中画或背景音乐，也支持从授权参考视频提炼视觉关系。它不替代事实核验，不会未经确认改变原意、声线或人物身份，缺少必要素材时会先说明限制。

structured-info:
  zh-CN:
    summary: 把口播内容转成结构清晰的线稿讲解动画，保留重点并支持多种声音和画幅输出。
    best-for:
    - 知识讲解动画
    - 手绘口播视频
    - 多画幅内容
    how-to-use: 提供口播或文案，确认画幅、时长与声音需求，审核脚本和分镜后逐镜制作。
    outputs: 校对后的脚本、分镜、动画成片与按需提供的字幕或画中画版本。
  en-US:
    summary: Turn speech content into a structured illustrated explainer while preserving key meaning and supporting multiple formats.
    best-for:
    - Educational explainers
    - Illustrated talking heads
    - Multi-format content
    how-to-use: Provide speech media or a script, confirm framing, duration and audio needs, then approve the script and storyboard before shot production.
    outputs: Reviewed script, storyboard, animated video and optional captioned or presenter-inset versions.

structured-info:
  zh-CN:
    summary: 将丝印装饰插画主题编排成画面精致、音效同步的奢华叙事短片，并可追加器乐版本。
    best-for:
    - 丝印插画
    - 奢华广告
    - 音效同步
    how-to-use: 提供主题、文案和参考图，先确认最终规格、装饰风格、叙事节奏与音频版本。
    outputs: 主题简报、关键元素、分镜、画面提示词、同步音效与短片成片。
  en-US:
    summary: Turn a silkscreen decorative-illustration theme into a refined narrative
      short with synchronized sound effects and an optional instrumental version.
    best-for:
    - Silkscreen Illustration
    - Luxury Ads
    - Sound Sync
    how-to-use: Provide the theme, copy, and references, then confirm final specs,
      decorative style, narrative rhythm, and audio version.
    outputs: A theme brief, key elements, storyboard, visual prompts, synchronized
      effects, and the finished short.

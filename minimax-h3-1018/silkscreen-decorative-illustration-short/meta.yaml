summary-en: Turns a refined silkscreen-decorative illustration theme into a restrained
  TVC workflow that follows the user's language and adds clean SFX assembly plus an
  optional same-duration instrumental BGM version.
summary-cn: 将丝印装饰插画主题转成跟随用户语言的同步音效短片，并可追加同等时长的器乐BGM版。
desc-en: Create a silkscreen-decorative illustrated short from a theme, scene, references,
  or characters. Confirm specs, design wide and close shots, generate visuals and
  synced sound, then optionally mix an instrumental version. Best for narrative decorative
  ads, not protected-brand copies or photoreal commercials.
desc-cn: 面向想制作丝印装饰插画风格创意短片的创作者。提供主题、场景、参考图或角色后，Skill 确认规格，设计元素和全景/近景分镜，生成画面、同步音效并合成，可选制作同长度器乐版。适合叙事装饰广告，不用于复刻受保护品牌或普通写实广告。

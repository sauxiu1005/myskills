summary-en: Generate line-doodle infographic explainer video plans and production
  assets from knowledge topics or lesson materials.
summary-cn: 根据知识主题或教材内容，生成线条小人图解科普视频方案与成片素材，适用于知识讲解短视频。
desc-en: Designed for users who need to turn knowledge content into line-doodle infographic
  explainer videos, this Skill fits science, humanities, history, social-science topics,
  textbook excerpts, and lesson materials. Users can provide a topic, source text,
  audience, duration, and platform requirements. The Skill clarifies the brief and
  video plan, extracts the core idea, writes narration, designs the diagram system
  and storyboard, then plans assets, generates media, assembles the video, and reviews
  quality. It outputs a production plan, storyboard assets, and a usable explainer
  video. Best for educational explainers and knowledge shorts; not intended for live-action
  realism, complex narrative films, or classroom exercise generation.
desc-cn: 面向需要将知识内容制作成线条小人图解科普视频的用户，适用于科学、人文、历史、社会科学、教材片段或课程材料的视频化表达。用户可输入知识主题、文本材料、受众、时长和平台要求。Skill
  会先梳理需求与视频生成方案，再提炼核心观点、撰写口播脚本、设计图解系统和分镜，随后规划素材、生成媒体并完成合成质检。最终输出制作方案、分镜素材及可用的科普视频成片。适合知识讲解和教育短视频，不适合真人写实视频、复杂剧情短片或课堂练习题生成。

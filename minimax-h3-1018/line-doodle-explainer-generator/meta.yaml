structured-info:
  zh-CN:
    summary: 将知识主题或教材转化为线条小人讲解方案，按确认节点完成可理解、可观看的科普视频。
    best-for:
    - 知识讲解
    - 线条动画
    - 科普短视频
    how-to-use: 提供主题、教材或讲解稿，先确认学习目标、受众、画幅与分步制作范围。
    outputs: 讲解结构、视觉隐喻、分镜方案、线条动画素材、旁白字幕与科普视频。
  en-US:
    summary: Turn a knowledge topic or teaching material into an understandable line-doodle
      explainer through confirmed production stages.
    best-for:
    - Knowledge Explainers
    - Line Animation
    - Science Shorts
    how-to-use: Provide the topic, teaching material, or narration, then confirm learning
      goals, audience, framing, and production scope.
    outputs: An explanation structure, visual metaphors, storyboard, line-animation
      assets, narration and subtitles, and the explainer video.

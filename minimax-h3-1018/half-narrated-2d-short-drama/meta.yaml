summary-en: Locks narration and dialogue windows during storyboard design, generates
  consistent narration with original dialogue assets, and hands the validated package
  to the user for editing.
summary-cn: 在分镜阶段锁定旁白与对白窗口，生成统一旁白和原声对白素材，交付用户自行剪辑。
desc-en: For creators making a 2D cel or webtoon half-narrated short drama from a
  story, script, reference video, or existing assets. The workflow locks plot, assets,
  resolution, narrator voice, and speech windows, binds shots to approved characters
  and scenes, verifies original dialogue, and generates narration under one consistent
  voice lock. It delivers narration, preserved dialogue tracks, timing metadata, and
  review notes for user-led editing. Additional generation requires scoped authorization;
  local defects retain unaffected assets, and whole-batch replacement needs separate
  approval. Best for staged short-drama production ending at narration handoff; it
  does not perform final cutting, mixing, subtitle burn-in, or export QC.
desc-cn: 面向制作2D赛璐珞或国漫半解说短剧的创作者。用户提供故事、剧本、参考视频或已有素材，流程锁定剧情、资产、清晰度、旁白音色和语音窗口，再按批准分镜生成镜头，核验对白原声并制作统一旁白。交付旁白、保留的对白轨、原文、时间元数据及检查记录，供用户自行剪辑。追加生成须明确授权，局部问题保留未受影响素材，整批重做另行批准。适合分阶段制作，以旁白交接为终点，不负责最终剪辑、混音、字幕烧录或导出质检。
